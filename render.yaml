# Ambiente de validação do SIGTCC no Render (Blueprint). Passo a passo em docs/deploy-render.md.
# Cria o banco PostgreSQL 16 e o serviço web, ambos no plano gratuito.

databases:
  - name: sigtcc-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: sigtcc
    user: sigtcc

services:
  - type: web
    name: sigtcc
    runtime: python
    plan: free
    region: virginia
    # Instala as dependências, junta os arquivos estáticos e aplica as migrações a cada deploy.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn sigtcc.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: COOKIES_SEGUROS
        value: "True"
      # Log de acesso na saída padrão (aparece em Logs do Render).
      - key: LOG_STDOUT
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: sigtcc-db
          property: connectionString
      # Sem SMTP configurado, os e-mails (links de ativação e de senha) aparecem em Logs.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
