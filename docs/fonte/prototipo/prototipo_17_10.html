function filtro(k, padrao) { if (UI.f[k] === undefined) UI.f[k] = padrao; return UI.f[k]; }
function selFiltro(k, rot, ops) { return `<div class="campo"><label for="f_${k}">${rot}</label><select class="inp" id="f_${k}" onchange="UI.f.${k}=this.value;render()">${ops.map(([v, t]) => `<option value="${esc(v)}" ${UI.f[k] === v ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>`; }
const fSem = () => { filtro('sem', semestres().includes(semAtual()) ? semAtual() : semestres()[0]); return selFiltro('sem', 'Período letivo', semestres().map(s => [s, s])); };
const noSem = (t) => semestreDe(t) === UI.f.sem;
// Períodos letivos cobertos pelo filtro de período das defesas (para contar as orientações pelas turmas do período, RBN-REL-01.1)
function semestresDoFiltro() {
  const f = periodo(); if (f.per_at === 'letivo') return [f.per_sem];
  const s = (iso) => iso ? iso.slice(0, 4) + '/' + (Number(iso.slice(5, 7)) <= 6 ? 1 : 2) : null;
  return semestres().filter(x => (!f.per_ini || x >= s(f.per_ini)) && (!f.per_fim || x <= s(f.per_fim)));
}
// RBN-REL-02.1: grupos de Status do TCC
const GRUPO = { 'Em Andamento': 'Ativos', 'Apto para Defesa': 'Ativos', 'Aprovado': 'Ativos', 'Aprovado com Correções': 'Ativos',
  'Concluído': 'Com Sucesso', 'Aprovado para TCC 2': 'Com Sucesso', 'Reprovado': 'Sem Sucesso', 'Desistente': 'Sem Sucesso', 'Jubilado': 'Sem Sucesso' };
const subTabela = (cab, linhas) => linhas.length ? `<table><tr>${cab.map(c => `<th>${esc(c)}</th>`).join('')}</tr>${linhas.map(l => `<tr>${l.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>` : '<span class="muted">Nenhum registro.</span>';
const tccsDoPeriodo = (sems) => S.tccs.filter(x => { const t = turma(x.turmaId); return sems.includes(semestreDe(t)) && t.alunos.includes(x.matricula); });

/* ---------- Tela de relatórios ---------- */
function viewRelatorios() {
  const lista = RELS.filter(relPermitido); if (!lista.length) return '<div class="vazio">Nenhum relatório disponível para o seu perfil.</div>';
  if (!lista.some(r => r.id === UI.rel)) UI.rel = lista[0].id;
  const r = RELS.find(x => x.id === UI.rel); const R = GERADORES[r.id](); UI.relAtual = { ...R, nome: r.nome };
  return `<div class="wrap-lg"><h2 class="pg">Relatórios</h2>
    <div class="rel-layout"><nav class="rel-menu">${lista.map(x => `<button class="${x.id === UI.rel ? 'ativo' : ''}" onclick="UI.rel='${x.id}';UI.f={};UI.fc=undefined;UI.relExp=null;render()">${esc(x.nome)}</button>`).join('')}</nav>
    <section><div class="flex entre flex-wrap mb8"><h3 style="font-family:var(--fonte-tit);font-weight:500;font-size:22px;margin:0">${esc(r.nome)}</h3>
      <div class="flex flex-wrap"><button class="btn" onclick="exportar('pdf')">PDF</button><button class="btn" onclick="exportar('csv')">CSV</button><button class="btn" onclick="exportar('xlsx')">XLSX</button></div></div>
      <div class="filtros">${R.filtros || ''}</div>
      <div class="tabela-wrap mt16"><table class="tb"><thead><tr>${R.colunas.map((c, i) => `<th class="${(R.num || []).includes(i) ? 'num' : ''}">${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${R.linhas.map((l, i) => { const sub = R.sub && R.sub[i]; const aberto = UI.relExp === r.id + i;
        return `<tr class="${(R.destaque || [])[i] ? 'alerta-amarelo' : ''} ${sub ? 'linha-exp' : ''}" ${sub ? `onclick="UI.relExp=UI.relExp==='${r.id + i}'?null:'${r.id + i}';render()"` : ''}>${l.map((c, j) => `<td class="${(R.num || []).includes(j) ? 'num' : ''}">${j === 0 && sub ? `<span class="ms" style="font-size:18px">${aberto ? 'expand_less' : 'expand_more'}</span> ` : ''}${(R.html && R.html[i] && R.html[i][j]) || esc(c)}</td>`).join('')}</tr>
        ${sub && aberto ? `<tr><td colspan="${l.length}" class="sub">${sub}</td></tr>` : ''}`; }).join('') || `<tr><td colspan="${R.colunas.length}" class="muted">Nenhum registro para os filtros escolhidos.</td></tr>`}
      </tbody>${R.total ? `<tfoot><tr>${R.total.map((c, j) => `<td class="${(R.num || []).includes(j) ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr></tfoot>` : ''}</table></div></section></div></div>`;
}

const GERADORES = {
  // RBN-REL-01.1: orientações, coorientações aceitas e bancas Realizadas por docente, com sub-listas
  rel011() {
    const gestor = ehGestao();
    const alvo = gestor ? filtro('docente', '') : me().id;           // docente comum vê só o próprio extrato
    const ds = S.docentes.filter(d => (!alvo || d.id === alvo) && (!gestor || passaCurso(d.curso))).sort((a, b) => a.nome.localeCompare(b.nome));
    const tccs = tccsDoPeriodo(semestresDoFiltro()).filter(temProposta);
    const bancas = S.defesas.filter(df => df.status === 'Realizada' && passaPeriodo(df));
    const linhas = [], sub = [], subExp = [];
    ds.forEach(d => {
      const ori = tccs.filter(x => x.orientadorId === d.id), co = tccs.filter(x => ehCoorientadorDoTcc(x, d.id));
      const bs = bancas.filter(df => membrosEfetivos(df).includes(d.id));
      const o1 = ori.filter(x => turma(x.turmaId).descricao === 'TCC 1').length, o2 = ori.length - o1;
      linhas.push([d.nome, d.curso, o1, o2, co.length, bs.length]);
      const al = [...ori.map(x => [aluno(x.matricula).nome, x.titulo, 'Orientador', x.situacao]), ...co.map(x => [aluno(x.matricula).nome, x.titulo, 'Coorientador', x.situacao])];
      const sb = bs.map(df => [fmtData(df.data), papelNaBanca(df, d.id), aluno(tcc(df.tccId).matricula).nome, tcc(df.tccId).titulo]);
      subExp.push([...al.map(r => ['', `Aluno: ${r[0]} · ${r[1]} · ${r[2]} · ${r[3]}`, '', '', '', '']), ...sb.map(r => ['', `Banca: ${r[0]} · ${r[1]} · ${r[2]} · ${r[3]}`, '', '', '', ''])]);
      sub.push(`<b>Alunos orientados ou coorientados</b>${subTabela(['Nome', 'Título do trabalho', 'Papel', 'Status do TCC'], al)}<b style="display:block;margin-top:8px">Sessões de banca</b>${subTabela(['Data', 'Papel na banca', 'Nome do Aluno', 'Título do Trabalho'], sb)}`);
    });
    return { filtros: selPeriodo() + (gestor ? selFiltro('docente', 'Docente', [['', 'Todos'], ...S.docentes.slice().sort((a, b) => a.nome.localeCompare(b.nome)).map(d => [d.id, d.nome])]) + selCurso() : ''),
      colunas: ['Docente', 'Curso', 'Quantidade de Orientandos em TCC 1', 'Quantidade de Orientandos em TCC 2', 'Quantidade de Coorientações', 'Total de Bancas no período'], num: [2, 3, 4, 5], linhas, sub, subExp, rotulo: rotuloPeriodo() };
  },
  // RBN-REL-01.2: pessoas distintas que atuaram como membros efetivos nas sessões Realizadas do período
  rel012() {
    const bs = S.defesas.filter(df => df.status === 'Realizada' && passaPeriodo(df) && passaCurso(cursoDaDefesa(df)));
    const membros = [...new Set(bs.flatMap(membrosEfetivos))];
    const internos = membros.filter(m => !ehExterno(m)), externos = membros.filter(ehExterno);
    const inst = {}; externos.forEach(m => { const i = externo(m).instituicao; inst[i] = (inst[i] || 0) + 1; });
    return { filtros: selPeriodo() + selCurso(), colunas: ['Descrição', 'Quantidade'], num: [1], rotulo: rotuloPeriodo(),
      linhas: [['Docentes do NUCOMP', internos.length], ['Membros Externos', externos.length], ...Object.entries(inst).sort((a, b) => b[1] - a[1]).map(([i, n]) => ['Instituição de origem: ' + i, n])] };
  },
  // RBN-REL-02.1: produção de TCCs agrupável por Curso, Área de Interesse ou Modalidade
  rel021() {
    const fs = fSem(); const dim = filtro('dim', 'Curso'); const abr = filtro('abr', 'todos');
    let l = tccsDoPeriodo([UI.f.sem]).filter(x => temProposta(x) && GRUPO[x.situacao] && passaCurso(cursoDoTcc(x)));
    if (abr === 'aprovados') l = l.filter(x => ['Aprovado para TCC 2', 'Aprovado', 'Aprovado com Correções', 'Concluído'].includes(x.situacao));
    if (abr === 'concluidos') l = l.filter(x => x.situacao === 'Concluído');
    const chave = (x) => dim === 'Curso' ? cursoDoTcc(x) : dim === 'Área de Interesse' ? (x.area || 'Não informada') : x.modalidade;
    const valores = dim === 'Curso' ? CURSOS.filter(passaCurso) : dim === 'Área de Interesse' ? [...AREAS, 'Não informada'] : [...MODALIDADES];
    const linhas = valores.map(v => { const g = l.filter(x => chave(x) === v); const c = (k) => g.filter(x => GRUPO[x.situacao] === k).length; return [v, g.length, c('Ativos'), c('Com Sucesso'), c('Sem Sucesso')]; });
    return { filtros: fs + selFiltro('dim', 'Agrupar por', [['Curso', 'Curso'], ['Área de Interesse', 'Área de Interesse'], ['Modalidade', 'Modalidade']]) + selFiltro('abr', 'Abrangência', [['todos', 'Todos'], ['aprovados', 'Todos os Aprovados'], ['concluidos', 'Apenas Concluídos']]) + selCurso(),
      colunas: [dim, 'Total de Trabalhos', 'Ativos', 'Com Sucesso', 'Sem Sucesso'], num: [1, 2, 3, 4], linhas, total: ['Total', ...[1, 2, 3, 4].map(i => linhas.reduce((s, r) => s + r[i], 0))] };
  },
  // RBN-REL-02.2: artigos dos TCCs das turmas do período
  rel022() {
    const fs = fSem();
    const l = tccsDoPeriodo([UI.f.sem]).filter(x => x.modalidade === 'Artigo Científico' && x.publicacao && passaCurso(cursoDoTcc(x)));
    const ap = (p) => p.homologacao || (['Aceito', 'Publicado'].includes(p.status) ? 'Em Análise' : '—');
    return { filtros: fs + selCurso(), colunas: ['Título do TCC', 'Aluno', 'Orientador', 'Veículo', 'Estrato Qualis/CAPES', 'Status de Submissão', 'Aproveitamento', 'Link ou DOI'],
      linhas: l.map(x => [x.titulo, aluno(x.matricula).nome, nomeMembro(x.orientadorId), x.publicacao.veiculo || '—', x.publicacao.qualis, x.publicacao.status, ap(x.publicacao), x.publicacao.link]),
      html: l.map(x => ({ 7: `<a href="${esc(x.publicacao.link)}" target="_blank" rel="noopener">${esc(x.publicacao.link)}</a>` })) };
  },
  // RBN-REL-02.3: Sem Proposta + Ativos + Com Sucesso + Sem Sucesso = Matriculados, por curso da turma
  rel023() {
    const fs = fSem();
    const linhas = CURSOS.filter(passaCurso).map(c => {
      const ms = S.turmas.filter(t => noSem(t) && t.curso === c).flatMap(t => t.alunos.map(m => tccDoAluno(m, t.id)?.situacao || 'Sem Proposta'));
      const n = (g) => ms.filter(s => (s === 'Sem Proposta' ? 'Sem Proposta' : GRUPO[s]) === g).length;
      return [c, ms.length, n('Sem Proposta'), n('Ativos'), n('Com Sucesso'), n('Sem Sucesso')];
    });
    return { filtros: fs + selCurso(), colunas: ['Curso', 'Matriculados', 'Sem Proposta', 'Ativos', 'Com Sucesso', 'Sem Sucesso'], num: [1, 2, 3, 4, 5], linhas, total: ['Total', ...[1, 2, 3, 4, 5].map(i => linhas.reduce((s, r) => s + r[i], 0))] };
  },
  // RBN-REL-02.4: série temporal completa, do período mais antigo ao mais recente
  rel024() {
    const linhas = semestres().slice().reverse().map(s => { const ts = S.turmas.filter(t => semestreDe(t) === s && passaCurso(t.curso)); const ids = ts.map(t => t.id);
      const alunos = new Set(ts.flatMap(t => t.alunos)).size;
      const def = S.defesas.filter(df => df.status === 'Realizada' && ids.includes(tcc(df.tccId).turmaId)).length;
      const art = new Set(S.tccs.filter(x => ids.includes(x.turmaId) && x.publicacao?.status === 'Publicado').map(x => x.publicacao.link)).size;
      const des = S.tccs.filter(x => ids.includes(x.turmaId) && (x.historicoSituacao || []).some(h => h.para === 'Desistente')).length;
      return [s, alunos, def, art, des]; });
    return { filtros: selCurso(), colunas: ['Período letivo', 'Alunos Vinculados', 'Defesas Realizadas', 'Artigos Publicados', 'Desistências'], num: [1, 2, 3, 4], linhas };
  },
  // RBN-REL-03.1: somente sessões Realizadas, com o filtro de período das defesas
  rel031() {
    const l = S.defesas.filter(df => df.status === 'Realizada' && passaPeriodo(df) && turmaNoEscopo(turma(tcc(df.tccId).turmaId))).sort((a, b) => (a.data + a.inicio).localeCompare(b.data + b.inicio));
    return { filtros: selPeriodo() + selCurso(), rotulo: rotuloPeriodo(), colunas: ['Data/Horário', 'Aluno', 'Orientador', 'Banca', 'Modalidade do TCC', 'Parecer'],
      linhas: l.map(df => { const x = tcc(df.tccId); return [`${fmtData(df.data)} ${df.inicio}`, aluno(x.matricula).nome, nomeMembro(df.banca.orientador), membrosEfetivos(df).map(nomeMembro).join(', '), x.modalidade, df.resultado.parecer]; }) };
  },
  // RBN-REL-03.2: Status do TCC ao lado de cada aluno, evidenciando Reprovado, Desistente e Jubilado
  rel032() {
    const fs = fSem();
    const ts = S.turmas.filter(t => noSem(t) && turmaNoEscopo(t)).sort((a, b) => a.identificador.localeCompare(b.identificador));
    const sit = (m, t) => tccDoAluno(m, t.id)?.situacao || 'Sem Proposta';
    return { filtros: fs + selCurso(), colunas: ['Turma', 'TCC 1 ou TCC 2', 'Professor da Disciplina', 'Total de Alunos', 'Alunos matriculados e Status do TCC'], num: [3],
      linhas: ts.map(t => [t.identificador, t.descricao, docente(t.professorId).nome, t.alunos.length, t.alunos.map(m => `${aluno(m).nome} (${sit(m, t)})`).join('; ')]),
      html: ts.map(t => ({ 4: t.alunos.map(m => `<div>${esc(aluno(m).nome)} ${chipSit(sit(m, t))}</div>`).join('') })) };
  },
  // RBN-REL-03.3: "Aprovado para TCC 2" listados primeiro e destacados
  rel033() {
    const fs = fSem();
    const l = S.tccs.filter(x => { const t = turma(x.turmaId); return t.descricao === 'TCC 1' && noSem(t) && t.alunos.includes(x.matricula) && turmaNoEscopo(t); })
      .sort((a, b) => (a.situacao === 'Aprovado para TCC 2' ? 0 : 1) - (b.situacao === 'Aprovado para TCC 2' ? 0 : 1) || aluno(a.matricula).nome.localeCompare(aluno(b.matricula).nome));
    return { filtros: fs + selCurso(), colunas: ['Matrícula', 'Nome do Aluno', 'Orientador (aceito em TCC 1)', 'Status do TCC'],
      linhas: l.map(x => [x.matricula, aluno(x.matricula).nome, x.orientadorId ? nomeMembro(x.orientadorId) : 'Sem orientador', x.situacao]), destaque: l.map(x => x.situacao === 'Aprovado para TCC 2') };
  },
  // RBN-REL-03.4: uma linha por sessão assistida, 2 horas cada, com o total ao final
  rel034() {
    const l = S.defesas.filter(df => df.status === 'Realizada' && passaPeriodo(df) && turmaNoEscopo(turma(tcc(df.tccId).turmaId))).flatMap(df => df.ouvintes.map(o => [o.nome, o.matricula, fmtData(df.data), 2]));
    l.sort((a, b) => a[0].localeCompare(b[0]));
    return { filtros: selPeriodo() + selCurso(), rotulo: rotuloPeriodo(), colunas: ['Nome do Ouvinte', 'Matrícula', 'Data da Defesa', 'Horas'], num: [3], linhas: l, total: ['Total de horas', '', '', l.length * 2] };
  }
};

/* ---------- Exportação em PDF, CSV ou XLSX (incluindo as sub-listas do RBN-REL-01.1) ---------- */
function exportar(fmt) {
  const R = UI.relAtual; const base = `SIGTCC_${normaliza(R.nome).replace(/[^a-z0-9]+/g, '_')}_${hojeISO()}`;
  const corpo = R.linhas.flatMap((l, i) => [l, ...((R.subExp && R.subExp[i]) || [])]).map(l => l.map(c => String(c ?? '')));
  const linhas = [R.colunas, ...corpo, ...(R.total ? [R.total.map(String)] : [])];
  const txt = linhas.map(l => l.map(c => /[;"\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c).join(';')).join('\r\n');
  if (fmt === 'csv') return entregarArquivo(base + '.csv', new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }), txt);
  if (fmt === 'xlsx') {
    if (typeof XLSX === 'undefined') return toast('Exportação XLSX indisponível sem internet. Use CSV.', 'erro');
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(linhas), 'Relatório');
    const buf = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    return entregarArquivo(base + '.xlsx', new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), txt);
  }
  const d2 = novoPdf(R.colunas.length > 5 ? 'landscape' : 'portrait'); if (!d2) return entregarArquivo(base + '.pdf', null, txt);
  d2.setFont('times', 'bold'); d2.setFontSize(13); d2.text(`SIGTCC · ${R.nome}`, 14, 16); d2.setFont('times', 'normal'); d2.setFontSize(9);
  const filtroTxt = [R.rotulo || (UI.f.sem ? 'Período letivo ' + UI.f.sem : ''), ehGestao() ? 'Curso: ' + (cursoFiltro() || 'Todos') : ''].filter(Boolean).join(' · ');
  d2.text(`Emitido em ${fmtDH(now().getTime())} por ${me().nome}${filtroTxt ? ' · ' + filtroTxt : ''}`, 14, 22);
  d2.autoTable({ startY: 27, head: [R.colunas], body: corpo, foot: R.total ? [R.total.map(String)] : undefined, styles: { font: 'times', fontSize: 8 }, headStyles: { fillColor: [25, 103, 210] } });
  entregarArquivo(base + '.pdf', d2.output('blob'), txt);
}
