<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIGTCC</title>
<!--
  SIGTCC — Sistema de Gerenciamento de TCC do Núcleo de Computação (NUCOMP) da EST/UEA
  Construído estritamente sobre a "Matriz_Requisitos_SIGTCC_30_09" (abas Cadastro, Defesa, Relatório e Won't Have).
  - Arquivo único (HTML + CSS + JavaScript), persistência local (localStorage) simulando o banco de dados.
  - Cada regra cita o ID do requisito (RAN/RBN-CAD, RAN/RBN-DEF, RAN/RBN-REL).
  - Itens fora da matriz ficam apenas na seção "Demonstração do protótipo" (caixa de e-mails simulada,
    relógio simulado, contas de exemplo e restauração dos dados de exemplo).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" rel="stylesheet">
<!-- SheetJS: leitura de planilhas XLSX na importação de alunos/docentes (RBN-CAD-06.4) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- jsPDF + AutoTable: Ata Final, Folha de Aprovação, declarações, agenda e relatórios em PDF (RBN-DEF-07/08, RAN-REL) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* ===================== Tokens de design (paleta do Classroom) ===================== */
:root{
  --azul:#1967d2; --azul-claro:#e8f0fe; --azul-btn:#1a73e8;
  --verde:#137333; --verde-claro:#e6f4ea;
  --laranja:#e37400; --amarelo:#f9ab00; --amarelo-claro:#fef7e0;
  --vermelho:#c5221f; --vermelho-claro:#fce8e6;
  --roxo:#9334e6; --teal:#129eaf;
  --texto:#202124; --texto2:#5f6368; --texto3:#80868b;
  --borda:#dadce0; --fundo:#fff; --fundo2:#f8f9fa; --hover:#f1f3f4;
  --radius:8px;
  --sombra:0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);
  --sombra2:0 1px 3px 0 rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
  --fonte:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --fonte-tit:"Figtree","Roboto",system-ui,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--fonte);color:var(--texto);background:var(--fundo);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
.ms{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;font-size:22px;line-height:1;display:inline-block;vertical-align:middle;-webkit-font-smoothing:antialiased;user-select:none}
/* ícones só aparecem quando a fonte Material Symbols carrega (evita exibir o nome do ícone offline) */
.ms{width:1em;overflow:hidden;flex:none}
body:not(.icones) .ms{visibility:hidden}
:focus-visible{outline:2px solid var(--azul-btn);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== Barra superior ===================== */
.topbar{position:sticky;top:0;z-index:30;height:64px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#fff;border-bottom:1px solid var(--borda)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--texto2);position:relative}
.iconbtn:hover{background:var(--hover)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--fonte-tit);font-size:22px;color:var(--texto2);text-decoration:none;white-space:nowrap}
.logo-mark{width:36px;height:36px;border-radius:8px;background:var(--verde);display:grid;place-items:center;color:#fff}
.crumb{font-family:var(--fonte-tit);font-size:18px;color:var(--texto);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb small{display:block;font-size:12px;color:var(--texto2);font-family:var(--fonte)}
.sep{color:var(--texto3)}
.spacer{flex:1}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--vermelho);color:#fff;font-size:11px;display:grid;place-items:center}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:500;font-size:14px;flex:none;background-size:cover;background-position:center}
.avatar.lg{width:72px;height:72px;font-size:30px}
.avatar.md{width:40px;height:40px;font-size:16px}

/* ===================== Layout principal ===================== */
.shell{display:flex;min-height:calc(100vh - 64px)}
.drawer{width:300px;flex:none;border-right:1px solid var(--borda);padding:8px 0;overflow-y:auto;height:calc(100vh - 64px);position:sticky;top:64px;background:#fff}
.drawer.oculto{display:none}
.dr-item{display:flex;align-items:center;gap:20px;height:48px;padding:0 24px;margin-right:12px;border-radius:0 24px 24px 0;cursor:pointer;color:var(--texto);border:0;background:none;width:calc(100% - 12px);text-align:left;font-weight:500}
.dr-item:hover{background:var(--hover)}
.dr-item.ativo{background:var(--azul-claro);color:var(--azul)}
.dr-item .ms{color:var(--texto2)}
.dr-item.ativo .ms{color:var(--azul)}
.dr-sec{padding:14px 24px 6px;font-size:13px;color:var(--texto2);border-top:1px solid var(--borda);margin-top:8px}
.dr-turma{display:flex;align-items:center;gap:16px;height:52px;padding:0 24px;margin-right:12px;border-radius:0 26px 26px 0;cursor:pointer;border:0;background:none;width:calc(100% - 12px);text-align:left}
.dr-turma:hover{background:var(--hover)}
.dr-turma.ativo{background:var(--azul-claro)}
.dr-turma .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:14px;flex:none}
.dr-turma b{display:block;font-weight:500;font-size:14px}
.dr-turma span{font-size:12px;color:var(--texto2)}
main{flex:1;min-width:0;padding:24px;max-width:100%}
.wrap{max-width:1000px;margin:0 auto}
.wrap-lg{max-width:1200px;margin:0 auto}

/* ===================== Cartões de turma (grade inicial) ===================== */
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.card-turma{border:1px solid var(--borda);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;height:296px;background:#fff;cursor:pointer}
.card-turma:hover{box-shadow:var(--sombra2)}
.ct-banner{position:relative;height:100px;padding:16px 16px 12px;color:#fff;background-repeat:no-repeat;background-position:right center}
.ct-banner h3{margin:0;font-family:var(--fonte-tit);font-size:22px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85%}
.card-turma:hover .ct-banner h3{text-decoration:underline}
.ct-banner p{margin:2px 0 0;font-size:14px;opacity:.95}
.ct-banner .prof{position:absolute;bottom:10px;left:16px;font-size:13px}
.ct-avatar{position:absolute;right:16px;bottom:-36px;border:0}
.ct-body{flex:1;padding:16px;padding-top:44px;font-size:13px;color:var(--texto2);overflow:hidden}
.ct-body .linha{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.ct-body .linha .ms{font-size:18px}
.ct-foot{border-top:1px solid var(--borda);height:52px;display:flex;justify-content:flex-end;align-items:center;padding:0 8px}

/* ===================== Página da turma ===================== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--borda);background:#fff;position:sticky;top:64px;z-index:20;overflow-x:auto;padding:0 12px;margin:-24px -24px 24px}
.tab{height:48px;padding:0 20px;border:0;background:none;cursor:pointer;color:var(--texto2);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{background:var(--hover);color:var(--texto)}
.tab.ativo{color:var(--azul);border-bottom-color:var(--azul)}
.banner-turma{border-radius:var(--radius);height:220px;padding:24px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;background-repeat:no-repeat;background-position:right center;margin-bottom:24px;position:relative}
.banner-turma h1{margin:0;font-family:var(--fonte-tit);font-size:36px;font-weight:500;line-height:1.1}
.banner-turma p{margin:6px 0 0;font-size:18px}
.banner-turma .info-btn{position:absolute;right:12px;bottom:12px;color:#fff}
.banner-turma .info-btn:hover{background:rgba(255,255,255,.2)}
.stream{display:grid;grid-template-columns:200px 1fr;gap:24px}
.box{border:1px solid var(--borda);border-radius:var(--radius);padding:16px;background:#fff}
.box h4{margin:0 0 12px;font-weight:500;font-size:15px}
.post{border:1px solid var(--borda);border-radius:var(--radius);padding:16px 20px;display:flex;gap:16px;align-items:flex-start;margin-bottom:16px;background:#fff}
.post:hover{box-shadow:var(--sombra)}
.post .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.post b{font-weight:500}
.post .meta{color:var(--texto2);font-size:12px}

/* ===================== Listas (Atividades / Pessoas) ===================== */
.sec-tit{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid currentColor;padding-bottom:10px;margin:28px 0 8px;font-family:var(--fonte-tit);font-size:28px;font-weight:500}
.sec-tit.c-azul{color:var(--azul)}
.sec-tit span.cont{font-size:14px;font-family:var(--fonte);font-weight:500}
.item{display:flex;align-items:center;gap:16px;padding:12px 8px;border-bottom:1px solid var(--borda);min-height:56px}
.item:last-child{border-bottom:0}
.item.clic{cursor:pointer;border-radius:8px}
.item.clic:hover{background:var(--hover)}
.item .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.item .corpo{flex:1;min-width:0}
.item .corpo b{font-weight:500;display:block}
.item .corpo small{color:var(--texto2)}
.acoes{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

/* ===================== Botões, chips, formulários ===================== */
.btn{height:36px;padding:0 20px;border-radius:4px;border:1px solid var(--borda);background:#fff;color:var(--azul-btn);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#f6fafe;border-color:#d2e3fc}
.btn.pri{background:var(--azul-btn);color:#fff;border-color:var(--azul-btn)}
.btn.pri:hover{background:#1765cc;box-shadow:var(--sombra)}
.btn.txt{border-color:transparent;background:none}
.btn.txt:hover{background:#f6fafe}
.btn.perigo{color:var(--vermelho)}
.btn.pri.perigo{background:var(--vermelho);color:#fff;border-color:var(--vermelho)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
a.btn{text-decoration:none}
.btn .ms{font-size:18px}
.fab{height:48px;padding:0 24px 0 16px;border-radius:24px;border:0;background:#fff;box-shadow:var(--sombra);color:var(--azul-btn);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.fab:hover{box-shadow:var(--sombra2);background:#f6fafe}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;background:var(--hover);color:var(--texto2);white-space:nowrap}
.chip.azul{background:var(--azul-claro);color:var(--azul)}
.chip.verde{background:var(--verde-claro);color:var(--verde)}
.chip.amarelo{background:var(--amarelo-claro);color:#b06000}
.chip.vermelho{background:var(--vermelho-claro);color:var(--vermelho)}
.chip.roxo{background:#f3e8fd;color:var(--roxo)}
.chip .ms{font-size:14px}
.sobrecarga{background:var(--amarelo-claro)!important}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:12px;color:var(--texto2);margin-bottom:4px;font-weight:500}
.campo .dica{font-size:12px;color:var(--texto3);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--borda);border-radius:4px;background:var(--fundo2)}
.inp:hover{background:#f1f3f4}
.inp:focus{outline:none;border-color:var(--azul-btn);background:#fff;box-shadow:inset 0 -2px 0 var(--azul-btn)}
textarea.inp{min-height:88px;resize:vertical}
.inp.erro{border-color:var(--vermelho);box-shadow:inset 0 -2px 0 var(--vermelho)}
.msg-erro{color:var(--vermelho);font-size:12px;margin-top:4px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.linha3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--azul-btn)}
.alerta{border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;font-size:13px}
.alerta .ms{font-size:20px}
.alerta.info{background:var(--azul-claro);color:#174ea6}
.alerta.aviso{background:var(--amarelo-claro);color:#7a4a00}
.alerta.erro{background:var(--vermelho-claro);color:var(--vermelho)}
.alerta.ok{background:var(--verde-claro);color:var(--verde)}

/* ===================== Tabelas ===================== */
.tabela-wrap{overflow-x:auto;border:1px solid var(--borda);border-radius:var(--radius)}
table.tb{border-collapse:collapse;width:100%;font-size:13px}
.tb th{text-align:left;font-weight:500;color:var(--texto2);background:var(--fundo2);padding:10px 12px;border-bottom:1px solid var(--borda);white-space:nowrap}
.tb td{padding:10px 12px;border-bottom:1px solid var(--borda);vertical-align:top}
.tb tr:last-child td{border-bottom:0}
.tb td.num,.tb th.num{text-align:right;font-variant-numeric:tabular-nums}
.tb tfoot td{font-weight:500;background:var(--fundo2)}

/* ===================== Diálogos (modais) ===================== */
.modal-fundo{position:fixed;inset:0;background:rgba(32,33,36,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;box-shadow:var(--sombra2);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column}
.modal.lg{max-width:860px}
.modal.xl{max-width:1100px}
.modal header{padding:20px 24px 8px;font-family:var(--fonte-tit);font-size:22px;display:flex;align-items:center;gap:12px}
.modal .mc{padding:8px 24px 16px;overflow-y:auto}
.modal footer{padding:12px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--borda);flex-wrap:wrap}
.toast-area{position:fixed;left:24px;bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:#323232;color:#fff;padding:14px 20px;border-radius:4px;box-shadow:var(--sombra2);max-width:420px;font-size:14px;display:flex;gap:10px;align-items:center}
.toast.erro{background:var(--vermelho)}
.toast.ok{background:var(--verde)}
.painel-notif{position:absolute;right:56px;top:56px;width:380px;max-height:70vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:var(--sombra2);z-index:50}
.painel-notif .n{padding:12px 16px;border-bottom:1px solid var(--borda);font-size:13px;cursor:pointer}
.painel-notif .n.nova{background:var(--azul-claro)}
.painel-notif .n small{color:var(--texto2);display:block;margin-top:4px}
.menu-user{position:absolute;right:8px;top:56px;width:320px;background:#fff;border-radius:8px;box-shadow:var(--sombra2);z-index:50;padding:20px;text-align:center}

/* ===================== Login e páginas públicas ===================== */
.login-pg{min-height:100vh;display:grid;place-items:center;background:var(--fundo2);padding:24px}
.login-card{background:#fff;border:1px solid var(--borda);border-radius:8px;width:100%;max-width:460px;padding:40px 36px}
.login-card h1{font-family:var(--fonte-tit);font-weight:500;font-size:24px;margin:16px 0 4px;text-align:center}
.login-card p.sub{text-align:center;color:var(--texto2);margin:0 0 24px}
.demo-lista{margin-top:12px;border:1px solid var(--borda);border-radius:8px;max-height:260px;overflow:auto}
.demo-lista button{display:flex;gap:12px;width:100%;border:0;background:#fff;padding:10px 12px;cursor:pointer;text-align:left;align-items:center;border-bottom:1px solid var(--borda)}
.demo-lista button:hover{background:var(--hover)}
.demo-lista small{color:var(--texto2);display:block}

/* ===================== Rubrica de avaliação ===================== */
.crit{border:1px solid var(--borda);border-radius:8px;padding:16px;margin-bottom:12px}
.crit-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crit-cab b{font-size:15px;font-weight:500}
.niveis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.nivel{border:1px solid var(--borda);border-radius:6px;padding:10px;font-size:12px;color:var(--texto2);background:var(--fundo2)}
.nivel b{display:block;font-size:12px;color:var(--texto);margin-bottom:4px}
.nivel.sel{border-color:var(--azul-btn);background:var(--azul-claro);color:#174ea6}
.nota-inp{width:96px;text-align:center;font-size:18px;font-weight:500}

/* ===================== Gráficos simples (barras) ===================== */
.barras{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.barra{display:grid;grid-template-columns:200px 1fr 60px;align-items:center;gap:12px;font-size:13px}
.barra .trilho{height:22px;background:var(--hover);border-radius:4px;overflow:hidden;display:flex}
.barra .preench{height:100%}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--texto2)}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ===================== Documento imprimível (ata, folha, declaração) ===================== */
.doc{background:#fff;color:#000;font-family:"Times New Roman",Georgia,serif;padding:32px 40px;border:1px solid var(--borda);font-size:13px;line-height:1.5}
.doc .cab{text-align:center;margin-bottom:16px}
.doc .cab b{display:block;font-size:14px}
.doc h2{text-align:center;font-size:16px;margin:16px 0}
.doc table{border-collapse:collapse;width:100%;margin:10px 0}
.doc td,.doc th{border:1px solid #000;padding:4px 6px;font-size:12px}
.doc .ass{display:grid;grid-template-columns:1fr 1fr;gap:36px 32px;margin-top:40px}
.doc .ass div{border-top:1px solid #000;padding-top:4px;text-align:center;font-size:12px}
.selo{font-family:monospace;font-size:11px;color:#444;margin-top:24px;text-align:center}
@media print{
  body *{visibility:hidden}
  #area-impressao,#area-impressao *{visibility:visible}
  #area-impressao{position:absolute;left:0;top:0;width:100%}
  #area-impressao .doc{border:0}
}

/* ===================== Utilidades e responsividade ===================== */
.flex{display:flex;gap:8px;align-items:center}
.flex-wrap{flex-wrap:wrap}
.entre{justify-content:space-between}
.muted{color:var(--texto2)}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.vazio{text-align:center;padding:48px 16px;color:var(--texto2)}
.vazio .ms{font-size:56px;color:var(--borda);display:block;margin:0 auto 8px}
h2.pg{font-family:var(--fonte-tit);font-weight:500;font-size:28px;margin:0 0 4px}
p.pg-sub{color:var(--texto2);margin:0 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi{border:1px solid var(--borda);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-family:var(--fonte-tit);font-weight:600}
.kpi span{color:var(--texto2);font-size:12px}
.rel-layout{display:grid;grid-template-columns:260px 1fr;gap:24px}
.rel-menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.rel-menu button:hover{background:var(--hover)}
.rel-menu button.ativo{background:var(--azul-claro);color:var(--azul);font-weight:500}
.rel-menu small{display:block;color:var(--texto3);font-size:11px}
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.filtros .campo{margin:0;min-width:150px}
@media (max-width:900px){
  .drawer{position:fixed;left:0;top:64px;z-index:40;box-shadow:var(--sombra2)}
  .stream,.rel-layout{grid-template-columns:1fr}
  .stream>.lado{display:none}

function now() { return new Date(Date.now() + (S ? S.relogioOffset || 0 : 0)); }        // relógio com o ajuste da demonstração

function token() { return Math.random().toString(36).slice(2, 8).toUpperCase() + Math.random().toString(36).slice(2, 6).toUpperCase(); }
function lerNota(s) { if (s === '' || s == null) return null; const t = String(s).trim(); if (!/^\d{1,2}(,\d)?$/.test(t.replace('.', ','))) return NaN; return Number(t.replace(',', '.')); }
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
// RBN-DEF-07.2: "Manaus, DD de mês de AAAA"
function dataExtenso(iso) { const [a, m, d] = iso.split('-'); return `${d} de ${MESES[Number(m) - 1]} de ${a}`; }

/* ---------- Persistência ---------- */
function salvar() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { /* sem storage: segue em memória */ } }
function carregar() { try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }

/* ---------- Acessores ---------- */
const docente = (id) => S.docentes.find(d => d.id === id);
const externo = (id) => S.externos.find(x => x.id === id);
const secretaria = (id) => S.secretarias.find(x => x.id === id);
const aluno = (m) => S.alunos.find(a => a.matricula === m);
const turma = (id) => S.turmas.find(t => t.id === id);
const tcc = (id) => S.tccs.find(t => t.id === id);
const defesa = (id) => S.defesas.find(d => d.id === id);
const atividade = (id) => S.atividades.find(a => a.id === id);
const tccDoAluno = (m, turmaId) => S.tccs.find(t => t.matricula === m && t.turmaId === turmaId);
const ehExterno = (id) => String(id || '').startsWith('x_');
const membro = (id) => docente(id) || externo(id);
const nomeMembro = (id) => membro(id)?.nome || '—';
function nomeComTitulo(id) { const m = membro(id); if (!m) return '—'; const t = { Doutor: 'Dr(a).', Mestre: 'Me./Ma.', Especialista: 'Esp.' }[m.titulacao] || ''; return `${t} ${m.nome}`.trim(); }
const semestreDe = (t) => t.ano + '/' + t.semestre;

const defesaDoTcc = (tccId) => S.defesas.filter(d => d.tccId === tccId && d.status !== 'Cancelada').slice(-1)[0];
// RBN-CAD-08.5: a Proposta existe quando o aluno salvou título, resumo e modalidade
const temProposta = (x) => !!(x && x.titulo);
// Curso considerado em filtros, relatórios e permissões: sempre o curso da turma (RBN-CAD-06.10)

const cursoDaDefesa = (df) => cursoDoTcc(tcc(df.tccId));

/* ---------- Curso do aluno (RBN-CAD-06.3 / 06.10) ----------
   O cadastro aceita o nome do curso do NUCOMP ou o código exportado pelo sistema acadêmico da UEA,
   reconhecido pela tabela fixa de equivalência CODIGOS_CURSO. */
function reconhecerCurso(valor) {
  const v = String(valor || '').trim();
  const porNome = CURSOS.find(c => normaliza(c) === normaliza(v));
  if (porNome) return porNome;
  return CODIGOS_CURSO[v.toUpperCase()] || null;
}
const cursoDoAluno = (a) => reconhecerCurso(a?.curso) || 'Código não reconhecido';
// RBN-CAD-06.3: um dos cursos do NUCOMP ou um código alfanumérico com letras maiúsculas e números, até 20 caracteres
const cursoValido = (v) => { const c = String(v || '').trim(); return CURSOS.includes(c) || /^[A-Z0-9]{1,20}$/.test(c); };

/* ---------- Sessão e papéis (RNF RAN-CAD-02: cada usuário acessa apenas as funções dos seus papéis) ---------- */
function me() {
  const s = S && S.sessao; if (!s) return null;
  const reg = s.tipo === 'docente' ? docente(s.id) : s.tipo === 'aluno' ? aluno(s.id) : s.tipo === 'secretaria' ? secretaria(s.id) : externo(s.id);
  if (!reg) return null;
  return { tipo: s.tipo, id: s.id, reg, nome: reg.nome, key: s.tipo[0] + ':' + s.id };
}
const ehAluno = () => me()?.tipo === 'aluno';
const ehDocente = () => me()?.tipo === 'docente';
const ehSecretaria = () => me()?.tipo === 'secretaria';
const ehExternoLogado = () => me()?.tipo === 'externo';
const ehCoord = () => ehDocente() && !!me().reg.coordenador;
const ehGestao = () => ehCoord() || ehSecretaria();
// Curso do usuário: Curso Coordenado do Coordenador ou Curso Vinculado da Secretaria (RBN-CAD-16.01)
const cursoGestao = () => ehCoord() ? me().reg.cursoCoordenado : ehSecretaria() ? me().reg.curso : null;
// RBN-CAD-02.5: papéis obtidos pelo uso do sistema — Professor da Disciplina, Orientador e Coorientador
const ehProfessorDe = (docId) => S.turmas.some(t => t.professorId === docId);
const ehOrientadorDe = (docId) => S.tccs.some(x => x.orientadorId === docId);
const ehCoorientadorAceito = (docId) => S.tccs.some(x => x.coorientadores.some(c => c.docenteId === docId && c.status === 'aceito'));
function papeisDe(d) {
  const p = []; if (d.coordenador) p.push('Coordenador de Curso (' + SIGLA[d.cursoCoordenado] + ')');
  if (ehProfessorDe(d.id)) p.push('Professor da Disciplina'); if (ehOrientadorDe(d.id)) p.push('Orientador'); if (ehCoorientadorAceito(d.id)) p.push('Coorientador');
  return p.length ? p : ['Docente'];
}

// Na demonstração os e-mails ficam na caixa simulada; "acao" abre o link do e-mail (ex.: { tipo: 'pedido', token })

// Registro interno de autor, data e hora (RNF de responsabilização e não repúdio)

function notificarMembro(id, texto, link) { notificar((ehExterno(id) ? 'e:' : 'd:') + id, texto, link); }
const emailDe = (id) => membro(id)?.email;

/* ---------- Status do TCC (RBN-CAD-08.3: cada valor tem o seu gatilho; RBN-CAD-08.7: histórico) ----------
   Toda mudança parte da ação de um usuário; o histórico grava esse usuário como responsável. */
function mudarSituacao(x, nova, gatilho, por) {
  if (x.situacao === nova) return;
  x.historicoSituacao.push({ de: x.situacao, para: nova, ts: now().getTime(), por: por || me()?.nome || '—', gatilho });
  x.situacao = nova;
  auditar('Status do TCC alterado', `${aluno(x.matricula).nome}: ${nova} (${gatilho})`);
}

/* ---------- Status de envio da entrega (RBN-CAD-09.3) ---------- */
const fimDoDia = (iso) => new Date(iso + 'T23:59:59').getTime();
const passouPrazo = (a) => !!a && now().getTime() > fimDoDia(a.dataLimite);
const ativDoTipo = (turmaId, tipo) => S.atividades.find(y => y.turmaId === turmaId && y.tipo === tipo);
const ativDocumento = (turmaId) => ativDoTipo(turmaId, 'Documento para Defesa');
const ativVF = (turmaId) => ativDoTipo(turmaId, 'Versão Final');
// Vale a data do primeiro envio (RBN-CAD-09.2); na Proposta, a data em que ela foi salva (RBN-CAD-07.1)
function statusEnvio(a, m) {
  if (a.tipo === 'Versão Final') { const x = tccDoAluno(m, a.turmaId); return x ? statusVF(x) : 'Aguardando Envio'; }
  let ts = null;
  if (a.tipo === 'Proposta') { const x = tccDoAluno(m, a.turmaId); ts = x && temProposta(x) ? (x.propostaEm || x.criadoEm) : null; }
  else ts = a.envios[m]?.ts || null;
  if (ts) return ts > fimDoDia(a.dataLimite) ? 'Entregue com Atraso' : 'Entregue';
  return passouPrazo(a) ? 'Não Entregue' : 'Aguardando Envio';
}
// Link exibido no acompanhamento (RBN-CAD-09.4): na Proposta, o Link do Documento da Proposta
function envioDe(a, m) {
  const x = tccDoAluno(m, a.turmaId);
  if (a.tipo === 'Proposta') return x && temProposta(x) ? { link: x.linkProposta || '', ts: x.propostaEm || x.criadoEm, proposta: true } : null;
  if (a.tipo === 'Versão Final') return x?.versaoFinal?.link ? { link: x.versaoFinal.link, ts: x.versaoFinal.ts } : null;
  return a.envios[m] || null;
}
// RBN-CAD-11.5 / RBN-DEF-01.3: entrega do tipo Documento para Defesa com status Entregue ou Entregue com Atraso
function documentoEntregue(x) { const a = ativDocumento(x.turmaId); return !!a && ['Entregue', 'Entregue com Atraso'].includes(statusEnvio(a, x.matricula)); }
const linkDocumento = (x) => ativDocumento(x.turmaId)?.envios[x.matricula]?.link || '';

/* ---------- Status de envio da Versão Final (RBN-CAD-09.3, valores 1 a 6) ---------- */
function statusVF(x) {
  const vf = x.versaoFinal;
  if (vf?.decisao) return vf.decisao;                                  // Devolvida para Ajuste ou Homologada
  if (vf?.link) return vf.atraso ? 'Entregue com Atraso' : 'Entregue';
  return passouPrazo(ativVF(x.turmaId)) ? 'Não Entregue' : 'Aguardando Envio';
}

/* ---------- Registro de eventos da sessão de defesa (histórico, RBN-DEF-01.11) ---------- */
function registrarDefesa(df, tipo, justificativa, por, ts) {
  df.historico.push({ tipo, justificativa: justificativa || '', por: por || me()?.nome || 'Sistema', ts: ts || now().getTime() });
}

/* ---------- Dados de exemplo: completa os históricos do Status do TCC e de sessão ----------
   Os dados de exemplo são criados já no estado final. Esta rotina reconstrói, para cada TCC e cada sessão,
   a sequência de eventos que levaria até ali, seguindo os gatilhos de RBN-CAD-09.4. */
function completarHistoricos() {
  const DIA = 864e5;
  S.defesas.forEach(df => {
    const ini = dataHora(df.data, df.inicio).getTime();
    const local = df.formato === 'Presencial' ? df.local : df.link;
    const ev = [{ tipo: 'Agendamento', justificativa: `${fmtData(df.data)}, ${df.inicio}–${df.fim} · ${local}`, por: nomeMembro(df.agendadoPor), ts: Math.min(df.criadaEm, ini - 14 * DIA) }];
    if (['Em Andamento', 'Realizada'].includes(df.status)) ev.push({ tipo: 'Início no horário marcado · Status: Em Andamento', justificativa: '', por: 'Automático (data e horário da sessão)', ts: ini });
    if (df.status === 'Realizada' && df.resultado) ev.push({ tipo: 'Liberação do resultado · Status: Realizada', justificativa: `Nota final ${fmtNota(df.resultado.final)} · ${df.resultado.parecer}`, por: nomeMembro(df.banca.orientador), ts: df.liberadoEm || ini + 3600e3 });
    df.historico = ev.concat(df.historico || []).sort((a, b) => a.ts - b.ts);
  });
  S.tccs.forEach(x => {
    if (x.historicoSituacao && x.historicoSituacao.length) return;        // já possui histórico real
    const t = turma(x.turmaId); const df = defesaDoTcc(x.id); const h = [];
    const base = df ? dataHora(df.data, df.inicio).getTime() : (x.criadoEm || Date.now());
    const reg = (para, gatilho, por, ts) => h.push({ de: h.length ? h[h.length - 1].para : null, para, gatilho, por, ts });
    reg('Sem Proposta', 'Vínculo do aluno à turma', nomeMembro(t.professorId), base - 100 * DIA);
    const s = x.situacao;
    if (temProposta(x)) {
      reg('Em Andamento', x.tccAnterior ? 'Transferência do TCC para a turma de TCC 2' : 'Cadastro da Proposta', x.tccAnterior ? nomeMembro(t.professorId) : aluno(x.matricula).nome, base - 90 * DIA);
      const passouApto = !!df || ['Apto para Defesa', 'Aprovado', 'Aprovado com Correções', 'Aprovado para TCC 2', 'Concluído'].includes(s);
      if (passouApto) reg('Apto para Defesa', 'Indicação do Orientador', nomeMembro(x.orientadorId), base - 15 * DIA);
      if (df && df.liberadoEm && df.resultado) reg(df.resultado.parecer, 'Liberação do resultado da banca', nomeMembro(df.banca.orientador), df.liberadoEm);
      if (s === 'Concluído') reg('Concluído', 'Homologação da Versão Final', nomeMembro(t.professorId), x.versaoFinal?.ts || base + 10 * DIA);
    }
    if (['Desistente', 'Jubilado', 'Reprovado'].includes(s) && x.encerramento) reg(s, 'Encerramento pelo Professor da Disciplina', x.encerramento.por, x.encerramento.ts);
    if (h[h.length - 1].para !== s) reg(s, 'Registro do Professor da Disciplina', nomeMembro(t.professorId), Date.now());
    x.historicoSituacao = h;
  });
}

/* ---------- Membro Externo: validade da conta (RBN-CAD-04.5 / 04.6) ----------
   Ativa desde o cadastro até 7 dias corridos após a data da defesa mais distante em que esteja vinculado
   (sessões Canceladas não contam). A prorrogação manual estende a validade por mais 7 dias. */
function validadeExterno(x) {
  const datas = S.defesas.filter(df => df.status !== 'Cancelada' && [df.banca.av1, df.banca.av2, df.banca.suplente].includes(x.id)).map(df => df.data).sort();
  let lim = datas.length ? addDias(datas[datas.length - 1], 7) : null;
  if (x.prorrogacao && (!lim || x.prorrogacao > lim)) lim = x.prorrogacao;
  return lim;                                                         // null: ainda sem banca (ativa desde o cadastro)
}
const externoAtivo = (x) => { const v = validadeExterno(x); return !v || v >= hojeISO(); };

/* ---------- Banca e resultado ---------- */
// Membros que avaliam: Orientador, 1º e 2º Avaliador, com o Suplente no lugar do substituído (RBN-DEF-02.6)
function membrosEfetivos(df) {
  const b = df.banca; let l = [b.orientador, b.av1, b.av2];
  if (b.acionamento) l = l.map(id => id === b.acionamento.substituido ? b.suplente : id);
  return l;
}
const membrosDaBanca = (df) => [...new Set([df.banca.orientador, df.banca.av1, df.banca.av2, df.banca.suplente].filter(Boolean))];
function papelNaBanca(df, id) {
  const b = df.banca;
  if (id === b.orientador) return 'Orientador (Presidente)';
  if (b.acionamento && id === b.suplente) return 'Suplente (em substituição)';
  if (id === b.av1) return '1º Avaliador'; if (id === b.av2) return '2º Avaliador'; if (id === b.suplente) return 'Suplente';
  return '';
}
const conceitoDe = (nota) => nota >= 8 ? 'Exemplar' : nota >= 6 ? 'Competente' : 'Necessita de Trabalho';
const faixaDe = (conceito) => CONCEITOS.find(c => c[0] === conceito);
// RBN-DEF-06.1: nota do avaliador = Σ(nota × peso) ÷ 10, uma casa decimal por arredondamento comercial
function notaAvaliador(av) { return r1(CRITERIOS.reduce((s, c) => s + Number(av.valores[c.id].nota) * c.peso, 0) / 10); }
// RBN-CAD-12.3 / RBN-DEF-06.2: artigo homologado em Qualis A ou B garante 6,0, em TCC 1 e em TCC 2
function artigoGarante(x) {
  const p = x.publicacao;
  return !!(p && x.modalidade === 'Artigo Científico' && p.homologacao === 'Homologado' && /^[AB]/.test(p.qualis));
}
// RBN-DEF-06.1, 06.2, 06.3 e 06.6: calcula quando os 3 membros enviaram a avaliação assinada
function calcularResultado(df) {
  const ms = membrosEfetivos(df);
  if (!ms.every(id => df.avaliacoes[id]?.enviado)) { df.resultado = null; return false; }          // RBN-DEF-06.6
  const x = tcc(df.tccId), t = turma(x.turmaId);
  const porMembro = Object.fromEntries(ms.map(id => [id, notaAvaliador(df.avaliacoes[id])]));
  const media = r1(ms.reduce((s, id) => s + porMembro[id], 0) / 3);                                   // média das notas já arredondadas
  const garante = artigoGarante(x);
  const final = garante ? Math.max(6, media) : media;
  let parecer = null;
  if (final < 6) parecer = 'Reprovado';
  else if (t.descricao === 'TCC 1') parecer = 'Aprovado para TCC 2';
  else parecer = (df.resultado && ['Aprovado', 'Aprovado com Correções'].includes(df.resultado.parecer)) ? df.resultado.parecer : null;   // TCC 2: escolha do Orientador
  df.resultado = { porMembro, media, final, garante, parecer, calculadoEm: now().getTime() };
  return true;
}

/* ---------- Rotinas automáticas (simulam os jobs do servidor) ---------- */
function rotinaAutomatica() {
  let mudou = false; const t0 = now();
  // RBN-DEF-01.7: Agendada/Reagendada → Em Andamento na data e horário marcados
  S.defesas.forEach(df => {
    if (['Agendada', 'Reagendada'].includes(df.status) && dataHora(df.data, df.inicio) <= t0) {
      df.status = 'Em Andamento'; mudou = true; registrarDefesa(df, 'Início no horário marcado · Status: Em Andamento', '', 'Automático (data e horário da sessão)');
    }
  });
  // RBN-CAD-09.6: lembretes 7 dias, 48 h e 24 h antes, só para quem ainda não enviou a entrega (turmas arquivadas não recebem, RBN-CAD-04.5)
  const marcos = [[168, '7 dias'], [48, '48 horas'], [24, '24 horas']];
  S.atividades.forEach(a => {
    const t = turma(a.turmaId); if (!t || t.arquivada) return;
    const limite = fimDoDia(a.dataLimite); if (limite <= t0.getTime()) return;
    t.alunos.forEach(m => {
      const x = tccDoAluno(m, t.id); if (x && SIT_BLOQUEIO.includes(x.situacao)) return;
      if (['Entregue', 'Entregue com Atraso', 'Homologada'].includes(statusEnvio(a, m))) return;
      if (a.tipo === 'Versão Final' && !['Aprovado', 'Aprovado com Correções'].includes(x?.situacao)) return;   // Versão Final só após a aprovação
      const ating = marcos.filter(([h]) => limite - t0.getTime() <= h * 3600e3); if (!ating.length) return;
      const [h, rot] = ating[ating.length - 1]; if (a.lembretes.includes(m + '|' + h)) return;
      ating.forEach(([hh]) => { if (!a.lembretes.includes(m + '|' + hh)) a.lembretes.push(m + '|' + hh); });
      notificar('a:' + m, `Lembrete: a entrega "${a.titulo}" (${t.identificador}) vence em ${rot}, em ${fmtData(a.dataLimite)}.`, 'turma:' + t.id);
      enviarEmail(aluno(m).email, 'SIGTCC — Lembrete de prazo', `A entrega "${a.titulo}" (${t.identificador}) vence em ${rot}, em ${fmtData(a.dataLimite)}. Você ainda não a enviou.`);
      mudou = true;
    });
  });
  // RBN-CAD-08.3: a Versão Final fora do prazo não muda o Status do TCC; fica Não Entregue ou Entregue com Atraso (RBN-CAD-09.3)
  if (mudou) salvar();
  return mudou;
}

/* ---------- Assinatura de demonstração (imagem gerada em canvas) ---------- */
function assinaturaDemo(nome) {
  try {
    const c = document.createElement('canvas'); c.width = 360; c.height = 90; const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, 360, 90);
    g.fillStyle = '#1a2b6d'; g.font = 'italic 34px "Brush Script MT", "Segoe Script", cursive, Georgia';
    const p = nome.split(' '); g.fillText(p[0] + ' ' + p[p.length - 1], 18, 56);
    g.strokeStyle = '#1a2b6d'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(14, 66); g.bezierCurveTo(120, 80, 220, 58, 340, 70); g.stroke();
    return c.toDataURL('image/png');
  } catch (e) { return null; }
}

function gerarDadosExemplo() {

  const antA = sem === 1 ? ano - 1 : ano, antS = sem === 1 ? 2 : 1;            // semestre anterior

  S = D;   // as funções auxiliares abaixo usam S

  // Locais de exemplo (RBN-CAD-04.1, campo 8, e RBN-DEF-01.1, campo 5: texto livre, sem cadastro de salas)

  const liberar = (df, parecer) => { if (parecer) df.resultado.parecer = parecer; df.status = 'Realizada'; df.liberadoEm = new Date(df.data + 'T' + df.fim + ':00').getTime();

  const df2 = addDef('df2', 'tc5', addDias(H, 5), '14:00', 'Presencial', 'sl9', { orientador: 'd4', av1: 'd1', av2: 'd5', suplente: 'd8' }, 'Agendada');
  df2.avaliacoes['d1'] = avaliacao(8.4, 2, null, true);   // Parte Escrita já avaliada antes da banca (RBN-DEF-05.1)

  const df3 = addDef('df3', 'tc6', isoData(ini), hIni, 'Remota', 'https://meet.google.com/abc-defg-hij', { orientador: 'd4', av1: 'd1', av2: 'x_1', suplente: 'd8' }, 'Em Andamento');
  df3.avaliacoes['d1'] = avaliacao(7.6, 1, docente('d1').assinatura); df3.avaliacoes['x_1'] = avaliacao(8.0, 4, null, true);
  const df4 = addDef('df4', 'tc7', addDias(H, -12), '09:00', 'Presencial', 'sl3', { orientador: 'd4', av1: 'd1', av2: 'd8' }, 'Realizada', [8.4, 8.2, 8.0]);
  liberar(df4, 'Aprovado com Correções'); df4.ouvintes = [{ nome: 'Igor Santana Reis', matricula: '2415080033' }, { nome: 'Larissa Campos Freire', matricula: '2415080044' }];
  df4.ocorrencias = 'Sessão iniciada no horário. A banca recomendou revisar a seção de resultados.';
  const df5 = addDef('df5', 'tc9', addDias(H, -15), '15:00', 'Presencial', 'sl8', { orientador: 'd8', av1: 'd2', av2: 'd1' }, 'Realizada', [9.6, 9.4, 9.5]); liberar(df5, 'Aprovado');
  df5.ouvintes = [{ nome: 'Igor Santana Reis', matricula: '2415080033' }];
  const df6 = addDef('df6', 'tc10', addDias(H, -18), '15:00', 'Presencial', 'sl8', { orientador: 'd8', av1: 'd2', av2: 'x_1' }, 'Realizada', [9.0, 8.6, 8.8]); liberar(df6, 'Aprovado');
  const df7 = addDef('df7', 'tc14', addDias(H, -10), '19:00', 'Presencial', 'sl2', { orientador: 'd5', av1: 'd3', av2: 'd7' }, 'Realizada', [8.0, 7.6, 7.8]); liberar(df7, 'Aprovado com Correções');
  const df8 = addDef('df8', 'tc16', addDias(H, -20), '14:00', 'Remota', 'https://meet.google.com/lic-sena-001', { orientador: 'd6', av1: 'd7', av2: 'x_2' }, 'Realizada', [7.4, 7.0, 7.2]); liberar(df8, 'Aprovado com Correções');
  // Semestre anterior (TCC 1) e dois semestres atrás (TCC 2)
  prev.forEach(([m, ref, o], i) => { const df = addDef('dp' + i, 'p' + ref, dataNoSem(antA, antS, 10 + i), '14:00', 'Presencial', 'sl1', { orientador: o, av1: o === 'd4' ? 'd1' : 'd2', av2: o === 'd8' ? 'd1' : 'd8' }, 'Realizada', [8.2 + i * 0.2, 7.8 + i * 0.2, 8.0 + i * 0.1]); liberar(df, null); });
  const df9 = addDef('df9', 'tc18', dataNoSem(ant2A, ant2S, 9), '19:00', 'Presencial', 'sl2', { orientador: 'd5', av1: 'd3', av2: 'd7' }, 'Realizada', [9.2, 9.0, 9.4]); liberar(df9, 'Aprovado');

  // Mensagens já enviadas na demonstração: pedido de orientação (RBN-CAD-10.1) e convite de coorientação (RBN-CAD-10.4)
  notificar('d:d4', 'Heloísa Martins Cruz pediu sua orientação para "Reconhecimento de fala para línguas indígenas do Amazonas".', 'orientacoes');
  enviarEmail('mlobato@uea.edu.br', 'SIGTCC — Pedido de orientação', 'Heloísa Martins Cruz pediu sua orientação para "Reconhecimento de fala para línguas indígenas do Amazonas". Aceite ou recuse pelo link.', { tipo: 'pedido', token: 'PED-HELOISA' });
  notificar('d:d6', 'Natália Guedes Barros indicou você como coorientador(a) de "Governança de dados em pequenas empresas de Manaus".', 'orientacoes');
  enviarEmail('tsena@uea.edu.br', 'SIGTCC — Convite de coorientação', 'Natália Guedes Barros indicou você como coorientador(a) de "Governança de dados em pequenas empresas de Manaus". Aceite ou recuse pelo link.', { tipo: 'coorientacao', token: 'COO-d6' });
  // Entregas do tipo Proposta: cumpridas ao salvar a Proposta (RBN-CAD-07.1). O link de exemplo vira o Link do Documento da Proposta
  D.atividades.filter(a => a.tipo === 'Proposta').forEach(a => {

    a.envios = {};
  });
  D.tccs.forEach(x => { if (x.titulo && !x.propostaEm) x.propostaEm = x.criadoEm; if (x.linkProposta === undefined) x.linkProposta = ''; });
  S.auditoria = [];
  return D;
}

/* ---------- Toasts e diálogos ---------- */
function toast(msg, tipo) {
  const el = document.createElement('div'); el.className = 'toast ' + (tipo || '');
  el.innerHTML = `<span class="ms">${tipo === 'erro' ? 'error' : tipo === 'ok' ? 'check_circle' : 'info'}</span><span>${esc(msg)}</span>`;
  $('toasts').appendChild(el); setTimeout(() => el.remove(), tipo === 'erro' ? 6500 : 3500);
}
const MODAIS = [];
function abrirModal({ titulo, corpo, botoes, tam, icone }) {
  const id = uid('m'); MODAIS.push({ id, botoes: botoes || [] });
  const div = document.createElement('div'); div.className = 'modal-fundo'; div.id = id;
  div.innerHTML = `<div class="modal ${tam || ''}" role="dialog" aria-modal="true" aria-labelledby="${id}_t">
    <header id="${id}_t">${icone ? `<span class="ms">${icone}</span>` : ''}${esc(titulo)}</header>
    <div class="mc">${corpo}</div>
    <footer>${(botoes || [{ txt: 'Fechar' }]).map((b, i) => `<button class="btn ${b.cls || 'txt'}" ${b.desab ? 'disabled' : ''} onclick="acaoModal('${id}',${i})">${esc(b.txt)}</button>`).join('')}</footer></div>`;
  div.addEventListener('mousedown', ev => { if (ev.target === div) fecharModal(id); });
  $('modais').appendChild(div);
  setTimeout(() => { const f = div.querySelector('input:not([type=checkbox]):not([disabled]),select:not([disabled]),textarea:not([disabled])'); if (f) f.focus(); }, 30);
  return id;
}
function acaoModal(id, i) {
  const m = MODAIS.find(x => x.id === id); if (!m) return;
  const b = (m.botoes.length ? m.botoes : [{}])[i];
  if (b && b.acao) { if (b.acao() === false) return; }       // false = mantém aberto (erro de validação)
  fecharModal(id);
}
function fecharModal(id) { const i = MODAIS.findIndex(x => x.id === id); if (i >= 0) MODAIS.splice(i, 1); const el = $(id); if (el) el.remove(); }
function fecharTodosModais() { MODAIS.splice(0).forEach(m => { const el = $(m.id); if (el) el.remove(); }); }
// Confirmação construída na página (o visualizador publicado não exibe confirm())
function confirmar(titulo, texto, rotulo, acao, perigo) {
  abrirModal({ titulo, corpo: `<p>${texto}</p>`, botoes: [{ txt: 'Cancelar' }, { txt: rotulo, cls: 'pri' + (perigo ? ' perigo' : ''), acao }] });
}
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && MODAIS.length) fecharModal(MODAIS[MODAIS.length - 1].id); });

/* ---------- Formulários ---------- */
function limparErros() { document.querySelectorAll('.inp.erro').forEach(e => e.classList.remove('erro')); document.querySelectorAll('.msg-erro').forEach(e => e.remove()); }
function erroCampo(id, msg) {
  const el = $(id); if (!el) { toast(msg, 'erro'); return false; }
  el.classList.add('erro'); const d = document.createElement('div'); d.className = 'msg-erro'; d.textContent = msg;
  (el.closest('.campo') || el.parentNode).appendChild(d); el.focus(); return false;
}
// Campo padronizado com rótulo, dica e contador de caracteres restantes
function campo(id, rotulo, o = {}) {
  const { tipo = 'text', valor = '', max, dica, opcoes, desab, attrs = '', ph = '' } = o;
  const livre = LIVRES.includes(id) ? 'filtrarLivre(this);' : '';   // texto livre: só letras, números, espaços e pontuação
  let c;
  if (tipo === 'select') c = `<select class="inp" id="${id}" ${desab ? 'disabled' : ''} ${attrs}>${opcoes.map(op => { const [v, t] = Array.isArray(op) ? op : [op, op]; return `<option value="${esc(v)}" ${String(v) === String(valor) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select>`;
  else if (tipo === 'textarea') c = `<textarea class="inp" id="${id}" ${max ? `maxlength="${max}"` : ''} ${desab ? 'disabled' : ''} placeholder="${esc(ph)}" oninput="${livre}contar(this)" ${attrs}>${esc(valor)}</textarea>`;
  else c = `<input class="inp" id="${id}" type="${tipo}" value="${esc(valor)}" ${max ? `maxlength="${max}"` : ''} ${desab ? 'disabled' : ''} placeholder="${esc(ph)}" ${max || livre ? `oninput="${livre}${max ? 'contar(this)' : ''}"` : ''} ${attrs}>`;
  return `<div class="campo"><label for="${id}">${esc(rotulo)}</label>${c}${(dica || max) ? `<div class="dica"><span>${dica || ''}</span>${max ? `<span id="${id}_cont">${max - String(valor).length} restantes</span>` : ''}</div>` : ''}</div>`;
}
function filtrarLivre(el) { const v = el.value.replace(TEXTO_LIVRE_FORA, ''); if (v !== el.value) { el.value = v; erroCampo(el.id, 'Use apenas letras, números, espaços e pontuação.'); } }
function contar(el) { const c = $(el.id + '_cont'); if (c) c.textContent = (el.maxLength - el.value.length) + ' restantes'; }

// Localiza a conta pela credencial (RBN-CAD-07.5)
function acharConta(cred) {
  if (/^\d{10}$/.test(cred)) { const a = aluno(cred); return a ? { tipo: 'aluno', reg: a, id: a.matricula } : null; }
  const e = normaliza(cred);
  const a = S.alunos.find(x => x.email && normaliza(x.email) === e); if (a) return { tipo: 'aluno', reg: a, id: a.matricula };
  const d = S.docentes.find(x => normaliza(x.email) === e); if (d) return { tipo: 'docente', reg: d, id: d.id };
  const s = S.secretarias.find(x => normaliza(x.email) === e); if (s) return { tipo: 'secretaria', reg: s, id: s.id };
  const x = S.externos.find(y => normaliza(y.email) === e); if (x) return { tipo: 'externo', reg: x, id: x.id };
  return null;
}
function entrar() {
  limparErros(); const cred = val('lg_cred'), senha = $('lg_senha').value;
  if (!cred) return erroCampo('lg_cred', 'Informe a matrícula ou o e-mail.');
  if (!/^\d{10}$/.test(cred) && !EMAIL_OK.test(cred)) return erroCampo('lg_cred', 'Informe a matrícula de 10 dígitos ou um e-mail no formato nome@domínio.');
  const c = acharConta(cred);
  if (!c) return erroCampo('lg_cred', 'Conta não encontrada. Confira a credencial ou faça o primeiro acesso.');
  // RBN-CAD-07.10: bloqueio por conta (vale para matrícula e e-mail), 15 minutos após 3 tentativas incorretas seguidas
  const chave = c.tipo + ':' + c.id; const f = S.loginFalhas[chave];
  if (f && f.ate && f.ate > now().getTime()) return erroCampo('lg_senha', `Conta bloqueada por 3 tentativas incorretas. Tente novamente em ${Math.ceil((f.ate - now().getTime()) / 60000)} minuto(s).`);
  if (!c.reg.senha) return erroCampo('lg_cred', 'Conta aguardando ativação. Use "Primeiro acesso" para receber o link de ativação.');
  if (c.reg.senha !== hashSenha(senha)) {
    const n = (f && !f.ate ? f.n : 0) + 1; S.loginFalhas[chave] = n >= 3 ? { n, ate: now().getTime() + 15 * 60e3 } : { n }; salvar();
    return erroCampo('lg_senha', n >= 3 ? 'Terceira tentativa incorreta: conta bloqueada por 15 minutos.' : `Senha incorreta. Tentativa ${n} de 3.`);
  }
  delete S.loginFalhas[chave];
  // RNF RAN-CAD-07: login só para contas ativas
  if ((c.tipo === 'docente' || c.tipo === 'secretaria') && c.reg.ativo === false) return erroCampo('lg_cred', 'Conta inativa.');
  if (c.tipo === 'externo' && !externoAtivo(c.reg)) return erroCampo('lg_cred', 'O acesso deste Membro Externo expirou. Entre em contato com o Orientador, o Professor da Disciplina, a Secretaria ou o Coordenador de Curso.');   // RBN-CAD-07.13
  iniciarSessao(c.tipo, c.id);
}

// RBN-CAD-07.3: 8 a 64 caracteres, letras, números e caracteres especiais, com ao menos uma letra e um número
function senhaValida(s) {
  if (s.length < 8 || s.length > 64) return 'A senha deve ter de 8 a 64 caracteres.';
  if (!/^[\x21-\x7E]+$/.test(s)) return 'Use apenas letras (A a Z), números e caracteres especiais, sem espaços ou acentos.';
  if (!/[A-Za-z]/.test(s) || !/\d/.test(s)) return 'A senha deve ter pelo menos uma letra e um número.';
  return '';
}
function criarToken(tipo, conta, extra) { const t = Object.assign({ token: 'TK-' + token(), tipo, conta, expira: now().getTime() + 24 * 3600e3, usado: false }, extra || {}); S.tokens.push(t); return t; }
// RBN-CAD-07.14: cada novo link de ativação invalida o anterior, para todos os perfis
function enviarAtivacao(tipo, id) {
  const reg = tipo === 'aluno' ? aluno(id) : tipo === 'docente' ? docente(id) : tipo === 'secretaria' ? secretaria(id) : externo(id);
  S.tokens.filter(t => t.tipo === 'ativacao' && t.conta.tipo === tipo && t.conta.id === id).forEach(t => t.usado = true);
  const tk = criarToken('ativacao', { tipo, id });
  enviarEmail(reg.email, 'SIGTCC — Ative sua conta', `Olá, ${reg.nome}. Use o link para criar sua senha. Ele vale por 24 horas.`, { tipo: 'ativacao', token: tk.token });
}
// RBN-CAD-07.1 (aluno) e 07.2 (Docente, Secretaria e Membro Externo)
function primeiroAcesso() {
  limparErros(); const mat = val('pa_mat'), email = val('pa_email');
  if (mat) {
    if (!/^\d{10}$/.test(mat)) return erroCampo('pa_mat', 'A matrícula deve ter exatamente 10 dígitos.');
    const a = aluno(mat); if (!a) return erroCampo('pa_mat', 'Matrícula não cadastrada. Procure o Professor da Disciplina.');
    if (a.senha) return erroCampo('pa_mat', 'Esta matrícula já concluiu o primeiro acesso. Use "Esqueci minha senha" ou procure o Professor da Disciplina.');
    if (!DOMINIO_INST.test(email) || email.length > 100) return erroCampo('pa_email', 'Informe o e-mail institucional no formato nome@uea.edu.br (até 100 caracteres).');
    const dono = acharConta(email); if (dono && !(dono.tipo === 'aluno' && dono.id === mat)) return erroCampo('pa_email', 'Este e-mail já está vinculado a outra conta.');
    a.email = email; enviarAtivacao('aluno', mat);
  } else {
    if (!EMAIL_OK.test(email) || email.length > 100) return erroCampo('pa_email', 'Informe um e-mail no formato nome@domínio (até 100 caracteres).');
    const c = acharConta(email); if (!c || c.tipo === 'aluno') return erroCampo('pa_email', 'E-mail não cadastrado. Aluno deve informar também a matrícula.');
    if (c.reg.senha) return erroCampo('pa_email', 'Esta conta já está ativa. Use "Esqueci minha senha" se precisar.');
    enviarAtivacao(c.tipo, c.id);
  }
  auditar('Solicitou primeiro acesso', mat || email); salvar(); renderLogin(); toast('Link de ativação enviado por e-mail, válido por 24 horas.', 'ok');
}
// RBN-CAD-07.11: recuperação de senha
function pedirRecuperacao() {

// RBN-CAD-06.10: exibe o curso reconhecido e alerta se diverge do curso da turma
function mostrarCursoRec() { const el = $('al_rec'); if (!el) return; const c = reconhecerCurso(val('al_curso')); const t = turma(UI.turmaId); el.textContent = val('al_curso') ? 'Curso reconhecido: ' + (c || 'Código não reconhecido') + (c && t && c !== t.curso ? ' — diverge do curso da turma (' + t.curso + ')' : '') : ''; }
// Regra única de vínculo, usada no formulário e na importação (RBN-CAD-06.1 a 06.4, 06.8 e 09.4 "Sem Proposta")
function vincularAluno(t, mat, nome, curso) {
  if (!/^\d{10}$/.test(mat)) return { erro: 'A matrícula deve ter exatamente 10 dígitos.', campo: 'al_mat' };
  if (!NOME_OK.test(nome) || nome.length > 150) return { erro: 'Nome: apenas letras, acentos e espaços (até 150).', campo: 'al_nome' };
  if (!cursoValido(curso)) return { erro: 'Curso: um curso do NUCOMP ou um código com letras maiúsculas e números (até 20).', campo: 'al_curso' };
  if (t.alunos.includes(mat)) return { erro: 'Esta matrícula já está vinculada a esta turma.', campo: 'al_mat' };   // RNF RAN-CAD-06
  let a = aluno(mat), msg = 'Aluno cadastrado na turma.';
  if (a) msg = 'Aluno já cadastrado vinculado à turma, com a mesma conta e histórico.';
  else { a = { matricula: mat, nome, curso, email: '', senha: null }; S.alunos.push(a); }
  t.alunos.push(mat);
  const tr = t.descricao === 'TCC 2' ? transferirTcc(a, t) : '';
  if (tr) msg += ' ' + tr; else novoTccSemProposta(mat, t.id);
  const rec = reconhecerCurso(a.curso); if (rec && rec !== t.curso) msg += ` Atenção: o curso do aluno (${rec}) diverge do curso da turma.`;
  auditar('Vinculou aluno à turma', `${mat} → ${t.identificador}`);
  return { ok: true, msg };
}

/* ---------- Importação CSV/XLSX (RBN-CAD-06.4) ---------- */
function formImportar(tid) {
  abrirModal({ titulo: 'Importar alunos', icone: 'upload_file', corpo: `<p>Arquivo <b>CSV</b> ou <b>XLSX</b> de até 2 MB. A primeira linha deve conter os cabeçalhos <b>Matrícula</b>, <b>Nome Completo</b> e <b>Curso</b>.</p>
    <input type="file" id="imp_arq" accept=".csv,.xlsx" class="inp"><div id="imp_res" class="mt16"></div>`,
    botoes: [{ txt: 'Fechar' }, { txt: 'Importar', cls: 'pri', acao: () => { processarImportacao(tid); return false; } }] });
}
async function lerPlanilha(arq) {
  const nome = arq.name.toLowerCase();
  if (nome.endsWith('.csv')) { const txt = (await arq.text()).replace(/^﻿/, ''); const sep = txt.split('\n')[0].includes(';') ? ';' : ','; return txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(sep).map(c => c.trim().replace(/^"|"$/g, ''))); }
  if (nome.endsWith('.xlsx')) { if (typeof XLSX === 'undefined') throw new Error('Leitor de XLSX indisponível sem internet. Use CSV.'); const wb = XLSX.read(await arq.arrayBuffer()); return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false }).filter(r => r.some(c => String(c || '').trim())).map(r => r.map(c => String(c ?? '').trim())); }
  throw new Error('Formato inválido: envie apenas CSV ou XLSX.');
}
async function processarImportacao(tid) {
  const f = $('imp_arq').files[0]; const res = $('imp_res'); const t = turma(tid);
  const erro = (m) => res.innerHTML = `<div class="alerta erro"><span class="ms">error</span><div>${m}</div></div>`;
  if (!f) return erro('Selecione um arquivo.');
  if (f.size > 2 * 1024 * 1024) return erro('O arquivo excede 2 MB.');
  let linhas; try { linhas = await lerPlanilha(f); } catch (e) { return erro(esc(e.message)); }
  const cab = (linhas.shift() || []).map(normaliza); const esp = ['matricula', 'nome completo', 'curso']; const idx = esp.map(c => cab.indexOf(c));
  if (idx.some(i => i < 0)) return erro('Cabeçalhos obrigatórios ausentes: Matrícula, Nome Completo e Curso.');
  const erros = [], ok = [];
  linhas.forEach((l, n) => { const [m, nome, curso] = idx.map(i => l[i] || ''); const ln = n + 2;
    if (!/^\d{10}$/.test(m)) erros.push(`Linha ${ln}: matrícula "${esc(m)}" deve ter exatamente 10 dígitos.`);
    else if (!NOME_OK.test(nome) || nome.length > 150) erros.push(`Linha ${ln}: nome inválido (apenas letras, acentos e espaços, até 150).`);
    else if (!cursoValido(curso)) erros.push(`Linha ${ln}: curso ausente ou inválido.`);
    else if (t.alunos.includes(m) || ok.some(o => o[0] === m)) erros.push(`Linha ${ln}: matrícula ${m} repetida ou já vinculada a esta turma.`);
    else ok.push([m, nome, curso]); });
  // RNF RAN-CAD-06: arquivo com linhas inválidas é rejeitado, indicando quais linhas têm erro
  if (erros.length) return erro(`<b>Arquivo rejeitado.</b> Corrija e envie novamente:<ul>${erros.map(e => `<li>${e}</li>`).join('')}</ul>`);
  if (!ok.length) return erro('O arquivo não tem linhas de dados.');
  ok.forEach(([m, n, c]) => vincularAluno(t, m, n, c)); auditar('Importou alunos', `${ok.length} de ${f.name}`); salvar();
  const naoRec = ok.filter(o => !reconhecerCurso(aluno(o[0]).curso)).length;   // RBN-CAD-06.10
  res.innerHTML = `<div class="alerta ok"><span class="ms">check_circle</span><div>${ok.length} aluno(s) importado(s). Códigos de curso não reconhecidos: ${naoRec}.</div></div>`;
  setTimeout(() => { fecharTodosModais(); render(); }, 1200);
}

function salvarPerfil() {
  limparErros(); const u = me(); const r = u.reg; const email = val('pf_email');
  const okEmail = u.tipo === 'externo' ? EMAIL_OK.test(email) : DOMINIO_INST.test(email);
  if (!okEmail || email.length > 100) return erroCampo('pf_email', u.tipo === 'externo' ? 'E-mail no formato nome@domínio (até 100).' : 'Use o e-mail institucional nome@uea.edu.br (até 100).');
  if (u.tipo === 'externo') { if (!val('pf_inst')) return erroCampo('pf_inst', 'Informe a instituição de origem.'); r.titulacao = val('pf_tit'); r.instituicao = val('pf_inst'); }
  let msg = 'Dados salvos.';
  if (normaliza(email) !== normaliza(r.email)) {
    const c = acharConta(email); if (c) return erroCampo('pf_email', 'Este e-mail já é usado por outra conta.');
    S.tokens.filter(t => t.tipo === 'email' && t.conta.tipo === u.tipo && t.conta.id === u.id).forEach(t => t.usado = true);
    const tk = criarToken('email', { tipo: u.tipo, id: u.id }, { novoEmail: email });
    enviarEmail(email, 'SIGTCC — Confirme seu novo e-mail', `Olá, ${r.nome}. Confirme a troca do e-mail da sua conta pelo link.`, { tipo: 'email', token: tk.token });
    msg = 'Enviamos um link de confirmação para o novo e-mail. A troca só vale depois da confirmação.';
  }
  auditar('Alterou o próprio perfil'); salvar(); render(); toast(msg, 'ok');

function lerImagem(inp, max, cb) {
  const f = inp.files[0]; if (!f) return;
  if (!['image/png', 'image/jpeg'].includes(f.type)) return toast('Envie uma imagem PNG ou JPG.', 'erro');
  if (f.size > 2 * 1024 * 1024) return toast('A imagem deve ter no máximo 2 MB.', 'erro');
  const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/png')); };
  img.src = URL.createObjectURL(f);
}
function lerAssinatura(inp, cb) { lerImagem(inp, 480, cb); }
function trocarSenha() {
  limparErros(); const r = me().reg; const s0 = $('pf_s0').value, s1 = $('pf_s1').value, s2 = $('pf_s2').value;
  if (r.senha !== hashSenha(s0)) return erroCampo('pf_s0', 'A senha atual não confere.');
  const e = senhaValida(s1); if (e) return erroCampo('pf_s1', e);
  if (s1 !== s2) return erroCampo('pf_s2', 'A confirmação deve ser idêntica à nova senha.');
  r.senha = hashSenha(s1); auditar('Alterou a senha'); salvar(); render(); toast('Senha alterada.', 'ok');
}

function abaAlunos(t) {
  const ed = !somenteLeitura(t); const alunos = t.alunos.map(aluno).sort((a, b) => a.nome.localeCompare(b.nome));
  return `<div class="flex entre flex-wrap mb16"><span></span>
