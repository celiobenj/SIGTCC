function blocoAluno(a, t) {
  const x = tccDoAluno(a.matricula, t.id); const curso = reconhecerCurso(a.curso);
  return `<button class="bloco" onclick="ir('aluno',{turmaId:'${t.id}',mat:'${a.matricula}'})">
    <span class="bloco-cab">${avatar(a.nome, null, 'md')}<span><b>${esc(a.nome)}</b><small>${a.matricula} · ${esc(curso || 'Código não reconhecido')}</small></span></span>
    <span class="bloco-tit">${temProposta(x) ? esc(x.titulo) : 'Sem Proposta'}</span>
    <small class="muted">Área de Interesse: ${x?.area ? esc(x.area) : '—'}</small>
    <span class="bloco-rod"><span class="bloco-ori"><span class="ms">supervisor_account</span>${x?.orientadorId ? esc(nomeMembro(x.orientadorId)) : 'Sem orientador'}</span>${chipSit(x ? x.situacao : 'Sem Proposta')}</span>
  </button>`;
}

/* ---------- Painel individual do aluno (acesso restrito ao Professor da Disciplina da turma) ---------- */
function viewAlunoTurma() {
  const t = turma(UI.turmaId), a = aluno(UI.mat);
  if (!t || !a || !donoTurma(t)) return '<div class="vazio">Aluno não encontrado ou sem permissão.</div>';
  if (!t.alunos.includes(a.matricula)) { UI.view = 'turma'; UI.tab = 'alunos'; return viewTurma(); }
  const x = tccDoAluno(a.matricula, t.id); const ed = !t.arquivada; const curso = reconhecerCurso(a.curso);
  const acoes = [];
  if (ed) {
    acoes.push(`<button class="btn" onclick="formAluno('${t.id}','${a.matricula}')"><span class="ms">edit</span>Editar aluno</button>`);
    if (a.email) acoes.push(`<button class="btn" onclick="resetarAcesso('${a.matricula}')"><span class="ms">lock_reset</span>Resetar primeiro acesso</button>`);
    if (x && turmaPorOrientador(t) && podeTransferir(x)) acoes.push(`<button class="btn" onclick="formTransferir('${x.id}')"><span class="ms">swap_horiz</span>Transferir para outra turma</button>`);
    if (x && !SIT_ENCERRADAS.includes(x.situacao)) acoes.push(`<button class="btn perigo" onclick="formEncerrar('${x.id}')"><span class="ms">block</span>Encerrar participação</button>`);
    if (!temProposta(x)) acoes.push(`<button class="btn perigo" onclick="formRemoverAluno('${t.id}','${a.matricula}')"><span class="ms">person_remove</span>Excluir da turma</button>`);
  }
  const fato = (rot, v) => `<div class="fato"><span>${rot}</span><b>${v}</b></div>`;
  return `<div class="wrap-lg">
    <button class="btn txt mb8" onclick="ir('turma',{turmaId:'${t.id}',tab:'alunos'})"><span class="ms">arrow_back</span>${esc(t.descricao)} · ${esc(t.identificador)}</button>
    <header class="turma-cab" style="--cor:${t.cor}">
      <div class="turma-tit"><div class="flex" style="gap:14px">${avatar(a.nome, null, 'lg')}<div><div class="turma-disc">Aluno · ${esc(t.descricao)} · ${esc(t.identificador)}</div><h1 style="font-size:26px">${esc(a.nome)}</h1></div></div>
        <div>${chipSit(x ? x.situacao : 'Sem Proposta')}</div></div>
      <div class="fatos">${fato('Matrícula', a.matricula)}${fato('Curso', esc(curso || 'Código não reconhecido') + (curso && curso !== t.curso ? ' (diverge do curso da turma)' : ''))}${fato('E-mail Institucional', a.email ? esc(a.email) : 'Primeiro acesso não realizado')}</div>
      ${acoes.length ? `<div class="flex flex-wrap">${acoes.join('')}</div>` : ''}
    </header>
    ${x && temProposta(x) ? etapasTcc(x, t) : ''}
    <div class="painel">
      <div class="painel-col">${secTcc(x, t)}${secAtividades(a, t)}${secAtas(x, t)}${x && x.modalidade === 'Artigo Científico' && temProposta(x) ? secPublicacaoPainel(x) : ''}</div>
      <div class="painel-col">${secOrientacao(x, t)}${secDefesaPainel(x, t)}${t.descricao === 'TCC 2' ? secVersaoFinal(x, t) : ''}</div>
    </div></div>`;
}
const caixa = (titulo, ic, corpo, extra) => `<section class="caixa"><header><span class="ms">${ic}</span><h3>${titulo}</h3>${extra || ''}</header>${corpo}</section>`;
const linhaDado = (rot, v) => `<div class="dado"><span>${rot}</span><div>${v}</div></div>`;

// Proposta e TCC (RBN-CAD-07.1 e 08.1 a 08.8)
function secTcc(x, t) {
  const hist = x ? `<div class="mt8"><button class="btn txt" onclick="verHistoricoSituacao('${x.id}')"><span class="ms">history</span>Histórico do Status do TCC</button></div>` : '';
  if (!temProposta(x)) return caixa('Proposta e TCC', 'description', `${linhaDado('Status do TCC', chipSit(x ? x.situacao : 'Sem Proposta'))}${x?.encerramento ? linhaDado('Encerramento', esc(x.encerramento.justificativa)) : ''}${hist}`);
  return caixa('Proposta e TCC', 'description', `
    ${linhaDado('Título', esc(x.titulo))}${x.subtitulo ? linhaDado('Subtítulo', esc(x.subtitulo)) : ''}${linhaDado('Resumo', `<span style="white-space:pre-wrap">${esc(x.resumo)}</span>`)}
    ${linhaDado('Modalidade', esc(x.modalidade))}${linhaDado('Link do Documento da Proposta', x.linkProposta ? `<a href="${esc(x.linkProposta)}" target="_blank" rel="noopener">abrir</a>` : '—')}${linhaDado('Área de Interesse', esc(x.area || '—'))}${linhaDado('Palavras-Chave', x.palavras.length ? x.palavras.map(p => `<span class="chip">${esc(p)}</span>`).join(' ') : '—')}
    ${linhaDado('Status do TCC', chipSit(x.situacao) + (x.encerramento ? ` <small class="muted">${esc(x.encerramento.justificativa)}</small>` : ''))}${hist}`);
}
// Orientação e coorientação (RAN-CAD-10)
function secOrientacao(x, t) {
  if (!x) return '';
  const hist = x.historicoOrientacao;
  return caixa('Orientação', 'supervisor_account', `
    ${linhaDado('Orientador', x.orientadorId ? esc(nomeComTitulo(x.orientadorId)) : '<b>Sem orientador</b>')}
    ${x.pedido?.status === 'pendente' ? linhaDado('Pedido pendente', `${esc(nomeMembro(x.pedido.docenteId))} · desde ${fmtDH(x.pedido.ts)}`) : ''}
    ${linhaDado('Coorientadores', x.coorientadores.map(c => `${esc(c.nome)} <small class="muted">${c.tipo === 'Docente' ? 'Docente do NUCOMP' + (c.status === 'pendente' ? ' · Aguardando aceite' : '') : 'Externo ao NUCOMP' + (c.instituicao ? ' · ' + esc(c.instituicao) : '')}</small>`).join('<br>') || '—')}
    ${hist.length ? `<details class="mt8"><summary class="muted" style="cursor:pointer">Histórico de orientação (${hist.length})</summary>${hist.map(h => `<div class="item"><div class="corpo"><b>${esc(h.motivo)}</b><small>${fmtDH(h.ts)}</small></div></div>`).join('')}</details>` : ''}`);
}
// Entregas do aluno (RBN-CAD-09.3 / 09.4)
function secAtividades(a, t) {
  const ativs = S.atividades.filter(y => y.turmaId === t.id).sort((p, q) => p.dataLimite.localeCompare(q.dataLimite));
  return caixa('Entregas', 'assignment', ativs.length ? `<div class="tabela-wrap"><table class="tb"><thead><tr><th>Entrega</th><th>Status de envio</th><th>Link</th></tr></thead><tbody>
    ${ativs.map(y => { const e = envioDe(y, a.matricula);
      return `<tr><td>${esc(y.titulo)}<br><small class="muted">${esc(y.tipo)} · Data Limite ${fmtData(y.dataLimite)}</small></td><td>${chipEnvio(statusEnvio(y, a.matricula))}${e?.ts ? `<br><small class="muted">${fmtDH(e.ts)}</small>` : ''}</td>
        <td>${e?.link ? `<a href="${esc(e.link)}" target="_blank" rel="noopener">abrir</a>` : e?.proposta ? 'Proposta registrada' : '—'}</td></tr>`; }).join('')}
    </tbody></table></div>` : '<p class="muted">Nenhuma entrega cadastrada na turma.</p>');
}
// Atas de orientação (RBN-CAD-11.2): o Professor da Disciplina consulta; edita e comenta se também for orientador ou coorientador
function secAtas(x, t) {
  if (!x) return '';
  const atas = S.atas.filter(a => a.tccId === x.id).sort((a, b) => b.data.localeCompare(a.data)); const u = me();
  const edita = !t.arquivada && (u.id === x.orientadorId || ehCoorientadorDoTcc(x, u.id));
  return caixa('Atas de orientação', 'history_edu', atas.map(a => `<div class="ata"><div class="flex entre"><b>${fmtData(a.data)}</b><small class="muted">registrada por ${esc(autorAta(a.autor))}</small></div>
      ${linhaDado('Pauta Discutida', esc(a.pauta))}${linhaDado('Metas Acordadas', esc(a.metas))}
      ${a.comentarios.map(c => `<div class="alerta info" style="margin:6px 0 0"><span class="ms">comment</span><div>${esc(c.texto)}<br><small>${esc(autorAta(c.autor))} · ${fmtDH(c.ts)}</small></div></div>`).join('')}
      ${edita ? `<div class="flex mt8"><button class="btn txt" onclick="formAta('${x.id}','${a.id}')">Editar</button><button class="btn txt" onclick="comentarAta('${a.id}')">Comentar</button></div>` : ''}</div>`).join('') || '<p class="muted">Nenhum encontro registrado.</p>',
    `<span class="cont">${atas.length} encontro(s)</span>${edita ? `<button class="btn txt" onclick="formAta('${x.id}')"><span class="ms">add</span>Registrar</button>` : ''}`);
}
// Publicação e aproveitamento do artigo (RAN-CAD-12)
function secPublicacaoPainel(x) {
  const p = x.publicacao;
  return caixa('Publicação do artigo', 'article', p ? `${linhaDado('Veículo de Publicação', esc(p.veiculo || '—'))}${linhaDado('Link ou DOI', `<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.link)}</a>`)}
    ${linhaDado('Estrato Qualis/CAPES', esc(p.qualis))}${linhaDado('Status de Submissão', esc(p.status))}${linhaDado('Aproveitamento', aproveitamento(p))}`
    : '<p class="muted">Nenhuma publicação registrada.</p>');
}
// Defesa: sessão, banca, resultado e documentos (RAN-DEF-01 a 07)
function secDefesaPainel(x, t) {
  if (!temProposta(x)) return '';
  const df = defesaDoTcc(x.id); const temHist = S.defesas.some(d => d.tccId === x.id);
  const btHist = temHist ? `<button class="btn txt" onclick="verHistoricoDefesa('${x.id}')"><span class="ms">history</span>Histórico</button>` : '';
  if (!df) {
    const pode = elegivel(x) && podeAgendar(x);
    return caixa('Defesa', 'gavel', `<p class="muted">Sessão não agendada.</p><div class="flex flex-wrap">${pode && !t.arquivada ? `<button class="btn pri" onclick="formAgendar('${x.id}')"><span class="ms">event</span>Agendar defesa</button>` : ''}${btHist}</div>`);
  }
  const r = df.resultado, lib = !!df.liberadoEm;
  return caixa('Defesa', 'gavel', `${linhaDado('Status', chipStatus(df.status))}${linhaDado('Data e horário', `${fmtData(df.data)}, ${df.inicio}–${df.fim}`)}
    ${linhaDado('Local ou link', df.formato === 'Presencial' ? esc(df.local) : `<a href="${esc(df.link)}" target="_blank" rel="noopener">${esc(df.link)}</a>`)}
    ${linhaDado('Banca', membrosDaBanca(df).map(m => `${esc(nomeComTitulo(m))} <small class="muted">${papelNaBanca(df, m)}</small>`).join('<br>'))}
    ${lib ? linhaDado('Resultado', `Nota final <b>${fmtNota(r.final)}</b> · ${esc(r.parecer)}`) : ''}
    ${df.ocorrencias ? linhaDado('Ocorrências', `<span style="white-space:pre-wrap">${esc(df.ocorrencias)}</span>`) : ''}
    ${lib ? `<div class="flex flex-wrap mt8"><button class="btn" onclick="pdfAta('${df.id}')"><span class="ms">download</span>Ata Final</button>${temFolha(x, df) ? `<button class="btn" onclick="pdfFolha('${df.id}')"><span class="ms">download</span>Folha de Aprovação</button>` : ''}</div>` : ''}
    <div class="flex flex-wrap mt8"><button class="btn txt" onclick="abrirDefesa('${df.id}')">Abrir sessão de defesa</button>${btHist}</div>`);
}
// Versão Final do TCC 2 (RBN-CAD-09.2, 09.3 e 09.5): entrega do tipo Versão Final
function secVersaoFinal(x, t) {
  if (!temProposta(x)) return '';
  const df = defesaDoTcc(x.id); const vf = x.versaoFinal; const r = df?.resultado; const a = ativVF(t.id);
  const aplica = df && df.liberadoEm && r.parecer !== 'Reprovado';
  if (!aplica) return caixa('Versão Final', 'verified', '<p class="muted">Disponível após a liberação do resultado com parecer Aprovado ou Aprovado com Correções.</p>');
  const st = statusVF(x);
  const podeDecidir = !t.arquivada && donoTurma(t) && ['Entregue', 'Entregue com Atraso'].includes(st);
  return caixa('Versão Final', 'verified', `${linhaDado('Data Limite da Versão Final', a ? fmtData(a.dataLimite) : 'Entrega do tipo Versão Final ainda não cadastrada')}
    ${precisaConferir(x, df) || x.correcoesConfirmadas ? linhaDado('Correções Conferidas', x.correcoesConfirmadas ? `Pelo Orientador ${esc(x.correcoesConfirmadas.por)} em ${fmtDH(x.correcoesConfirmadas.ts)}` : 'Aguardando o Orientador clicar em Correções Conferidas') : ''}
    ${linhaDado('Status de envio', chipVF(st))}
    ${vf?.link ? linhaDado('Link da Versão Final', `<a href="${esc(vf.link)}" target="_blank" rel="noopener">abrir</a> · enviado em ${fmtDH(vf.ts)}`) : ''}
    ${vf?.msg ? linhaDado('Mensagem ao aluno', esc(vf.msg)) : ''}
    ${podeDecidir ? `<button class="btn pri" onclick="formHomologarVF('${x.id}')"><span class="ms">fact_check</span>Homologar ou devolver</button>` : ''}`);
}

/* ---------- Transferência para a turma de TCC 2 de outro orientador (RBN-CAD-06.9) ---------- */
// Mesmas condições da troca de orientador (RBN-CAD-10.6)
const podeTransferir = (x) => ['Em Andamento', 'Apto para Defesa'].includes(x.situacao) && !defesaAtiva(x);
// Tela da Secretaria: alunos das turmas de TCC 2 com orientador automático
function viewTransferencias() {
  if (!ehSecretaria()) return '<div class="vazio">Acesso restrito à Secretaria.</div>';
  const l = S.tccs.filter(x => { const t = turma(x.turmaId); return turmaPorOrientador(t) && passaCurso(t.curso) && !t.arquivada && t.alunos.includes(x.matricula); });
  return `<div class="wrap-lg"><h2 class="pg">Transferências de turma</h2><p class="pg-sub">Turmas de TCC 2 com orientador automático (RBN-CAD-05.10): a troca de orientador é feita transferindo o aluno para a turma do novo orientador.</p>
    <div class="filtros">${selCurso()}</div>
    <div class="tabela-wrap"><table class="tb"><thead><tr><th>Aluno</th><th>Matrícula</th><th>Turma</th><th>Orientador</th><th>Status do TCC</th><th></th></tr></thead><tbody>
    ${l.map(x => { const t = turma(x.turmaId); return `<tr><td>${esc(aluno(x.matricula).nome)}</td><td>${x.matricula}</td><td>${esc(t.identificador)}</td><td>${esc(nomeMembro(x.orientadorId))}</td><td>${chipSit(x.situacao)}</td>
      <td>${meuCurso(t.curso) && podeTransferir(x) ? `<button class="btn" onclick="formTransferir('${x.id}')">Transferir</button>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="6" class="muted">Nenhum aluno em turmas de TCC 2 com orientador automático.</td></tr>'}</tbody></table></div></div>`;
}
function formTransferir(tccId) {
  const x = tcc(tccId), t = turma(x.turmaId);
  if (!(donoTurma(t) || (ehSecretaria() && meuCurso(t.curso)))) return toast('A transferência é feita pelo Professor da Disciplina da turma de origem ou pela Secretaria do curso.', 'erro');
  if (!podeTransferir(x)) return toast('Transferência permitida somente com o TCC Em Andamento ou Apto para Defesa e sem sessão Agendada, Reagendada ou Em Andamento.', 'erro');
  const destinos = S.turmas.filter(d => d.id !== t.id && !d.arquivada && d.descricao === 'TCC 2' && d.curso === t.curso && semestreDe(d) === semestreDe(t));
  if (!destinos.length) return toast('Não há turma de TCC 2 de outro orientador neste curso e período: a transferência não é permitida.', 'erro');
  abrirModal({ titulo: 'Transferir aluno', icone: 'swap_horiz', corpo: `<p><b>${esc(aluno(x.matricula).nome)}</b> sai de ${esc(t.identificador)}; o professor da turma de destino passa a ser o orientador. O TCC, o Status do TCC e o histórico vão para a nova turma.</p>
    ${campo('tr_dest', 'Turma de Destino *', { tipo: 'select', opcoes: [['', 'Selecione…'], ...destinos.map(d => [d.id, `${d.identificador} — ${docente(d.professorId).nome}`])] })}${campo('tr_just', 'Justificativa *', { tipo: 'textarea', max: 500 })}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Transferir', cls: 'pri', acao: () => {
      limparErros(); const d = turma(val('tr_dest')), j = val('tr_just');
      if (!d) return erroCampo('tr_dest', 'Escolha a turma de destino.'); if (!j) return erroCampo('tr_just', 'A justificativa é obrigatória.');
      const m = x.matricula, ant = x.orientadorId;
      t.alunos = t.alunos.filter(y => y !== m); t.removidos.push({ matricula: m, tipo: 'Transferência para ' + d.identificador, justificativa: j, ts: now().getTime(), por: me().nome });
      if (!d.alunos.includes(m)) d.alunos.push(m);
      x.turmaId = d.id; x.orientadorId = d.professorId; x.pedido = null; encerrarCoorientacaoDe(x, d.professorId);
      x.historicoOrientacao.push({ de: ant, para: d.professorId, ts: now().getTime(), motivo: `Transferência de ${t.identificador} para ${d.identificador}: ${nomeMembro(ant)} → ${nomeMembro(d.professorId)} (${j})` });
      notificar('a:' + m, `Você foi transferido(a) para a turma ${d.identificador}. Seu orientador agora é ${nomeMembro(d.professorId)}.`, 'turma:' + d.id);
      notificar('d:' + ant, `${aluno(m).nome} foi transferido(a) para a turma ${d.identificador}.`);
      notificar('d:' + d.professorId, `${aluno(m).nome} foi transferido(a) para sua turma ${d.identificador}.`, 'turma:' + d.id);
      auditar('Transferiu aluno de turma', `${aluno(m).nome}: ${t.identificador} → ${d.identificador} — ${j}`); salvar(); ir(ehSecretaria() ? 'transferencias' : 'turma', { turmaId: t.id, tab: 'alunos' }); toast('Aluno transferido.', 'ok'); } }] });
}
/* =====================================================================
   PARTE 4 — MARCOS DE ENTREGA, PROPOSTA E TCC, ORIENTAÇÃO E COORIENTAÇÃO,
             ATAS, PUBLICAÇÕES, ENCERRAMENTO E VERSÃO FINAL
   ===================================================================== */

// RBN-CAD-09.3: um único conjunto de status de envio para todas as entregas
const chipEnvio = (s) => `<span class="chip ${['Entregue', 'Homologada'].includes(s) ? 'verde' : ['Entregue com Atraso', 'Devolvida para Ajuste'].includes(s) ? 'amarelo' : s === 'Não Entregue' ? 'vermelho' : ''}">${esc(s)}</span>`;
const chipVF = chipEnvio;
const bloqueado = (x) => !!x && SIT_BLOQUEIO.includes(x.situacao);                  // RBN-CAD-08.5
const autorAta = (id) => /^\d{10}$/.test(id) ? aluno(id).nome : nomeMembro(id);
// RBN-CAD-12.2 / 12.3: aproveitamento do artigo
const aproveitamento = (p) => !p ? '—' : p.homologacao === 'Homologado' ? '<span class="chip verde">Homologado</span>' : p.homologacao === 'Recusado' ? '<span class="chip vermelho">Recusado</span>' : ['Aceito', 'Publicado'].includes(p.status) ? '<span class="chip">Em Análise</span>' : '—';

/* ---------- Aba Entregas (RAN-CAD-09) ---------- */
const ICONE_TIPO = { 'Proposta': 'lightbulb', 'Documento para Defesa': 'description', 'Versão Final': 'verified', 'Outra': 'assignment' };
function abaAtividades(t) {
  const u = me(); const ed = !somenteLeitura(t);
  const l = S.atividades.filter(a => a.turmaId === t.id).sort((a, b) => a.dataLimite.localeCompare(b.dataLimite));
  return `${ed ? `<div class="mb16"><button class="fab" onclick="formAtividade('${t.id}')"><span class="ms">add</span>Cadastrar entrega</button></div>` : ''}
    ${l.map(a => { const st = u.tipo === 'aluno' ? chipEnvio(statusEnvio(a, u.id)) : '';
      return `<div class="item clic" onclick="abrirAtividade('${a.id}')"><span class="ic" style="background:${t.cor}"><span class="ms">${ICONE_TIPO[a.tipo] || 'assignment'}</span></span>
        <div class="corpo"><b>${esc(a.titulo)}</b><small>${esc(a.tipo)} · Data Limite ${fmtData(a.dataLimite)}</small></div><div class="acoes">${st}</div></div>`; }).join('') || '<div class="vazio"><span class="ms">assignment</span>Nenhuma entrega cadastrada.</div>'}`;
}
// RBN-CAD-09.1: cadastro de entrega; RBN-CAD-09.6: notifica os alunos
function formAtividade(tid) {
  const t = turma(tid);
  abrirModal({ titulo: 'Cadastrar entrega', icone: 'assignment', tam: 'lg', corpo: `
    ${campo('ad_tipo', 'Tipo *', { tipo: 'select', opcoes: [['', 'Selecione…'], ...tiposDaTurma(t).map(x => [x, x])], dica: t.descricao === 'TCC 1' ? 'Em TCC 1: Proposta, Documento para Defesa ou Outra. No máximo uma de cada tipo, exceto Outra.' : 'Em TCC 2: Documento para Defesa, Versão Final ou Outra. No máximo uma de cada tipo, exceto Outra.' })}
    ${campo('ad_tit', 'Título *', { max: 100, ph: 'Entrega do Documento', dica: 'O título não define o tipo da entrega.' })}
    ${campo('ad_inst', 'Instruções', { tipo: 'textarea', max: 1000 })}${campo('ad_data', 'Data Limite *', { tipo: 'date', dica: 'O prazo vale até 23:59 da data escolhida. Na Versão Final, é o prazo pós-banca do texto final corrigido.' })}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Cadastrar', cls: 'pri', acao: () => {
      limparErros(); const d = { titulo: val('ad_tit'), tipo: val('ad_tipo'), instrucoes: val('ad_inst'), dataLimite: val('ad_data') };
      if (!d.tipo) return erroCampo('ad_tipo', 'Escolha o tipo.');

function etapasTcc(x, t) {

function secaoOrientacaoAluno(x, t, ro) {
  let h = '<div class="sec-tit c-azul">Orientação</div>';
  if (x.orientadorId) h += `<div class="item">${avatar(nomeMembro(x.orientadorId), null, 'md')}<div class="corpo"><b>${esc(nomeComTitulo(x.orientadorId))}</b><small>Orientador</small></div></div>`;
  else h += '<p class="muted">Sem orientador.</p>';
  const pendente = x.pedido && x.pedido.status === 'pendente';
  // RBN-CAD-10.1: o aluno pode cancelar o pedido enquanto ele estiver pendente
  if (pendente) h += `<div class="alerta info"><span class="ms">hourglass_top</span><div style="flex:1">Pedido de orientação enviado a <b>${esc(nomeMembro(x.pedido.docenteId))}</b> em ${fmtDH(x.pedido.ts)}, aguardando resposta. A lista fica bloqueada até a resposta.</div>${ro ? '' : `<button class="btn txt" onclick="cancelarPedido('${x.id}')">Cancelar Pedido</button>`}</div>`;
  const travado = defesaAtiva(x);
  // RBN-CAD-10.1: indicação a partir do vínculo à turma, com ou sem Proposta; RBN-CAD-10.6: troca só Em Andamento ou Apto para Defesa
  // (não exibida nas turmas com orientador automático, RBN-CAD-04.2)
  const podeIndicar = x.orientadorId ? ['Em Andamento', 'Apto para Defesa'].includes(x.situacao) : ['Sem Proposta', 'Em Andamento', 'Apto para Defesa'].includes(x.situacao);
  if (!turmaPorOrientador(t) && !ro && !pendente && podeIndicar && !travado) {
    const ops = docentesAtivos().filter(d => d.id !== x.orientadorId).map(d => [d.id, `${d.nome} — ${d.titulacao} · ${d.curso}`]);
    h += `<div class="linha2" style="align-items:end">${campo('or_sel', x.orientadorId ? 'Trocar de orientador' : 'Indicar orientador', { tipo: 'select', opcoes: [['', 'Selecione um docente…'], ...ops] })}<div class="campo"><button class="btn pri" onclick="indicarOrientador('${x.id}')"><span class="ms">send</span>Enviar pedido</button></div></div>`;
  }
  // RBN-CAD-10.3, 10.4 e 10.7: coorientadores
  h += `<h4 style="font-weight:500;margin:16px 0 8px">Coorientadores</h4>
    ${x.coorientadores.map((c, i) => `<div class="item"><span class="ic" style="background:${c.tipo === 'Docente' ? 'var(--azul)' : '#80868b'}"><span class="ms">person</span></span><div class="corpo"><b>${esc(c.nome)}</b><small>${c.tipo === 'Docente' ? 'Docente do NUCOMP' : 'Externo ao NUCOMP'}${c.email ? ' · ' + esc(c.email) : ''}${c.instituicao && c.tipo === 'Externo' ? ' · ' + esc(c.instituicao) : ''}</small></div>
      ${c.status === 'pendente' ? '<span class="chip amarelo">Aguardando aceite</span>' : ''}
      ${ro || travado ? '' : c.status === 'pendente' ? `<button class="btn txt" onclick="removerCoorientador('${x.id}',${i},'cancelar')">Cancelar convite</button>` : `<button class="btn txt" onclick="removerCoorientador('${x.id}',${i},'substituir')">Substituir</button><button class="btn txt" onclick="removerCoorientador('${x.id}',${i},'remover')">Remover</button>`}</div>`).join('') || '<p class="muted">Nenhum coorientador registrado.</p>'}
    ${ro || travado || !x.orientadorId ? '' : `<button class="btn" onclick="formCoorientador('${x.id}')"><span class="ms">person_add</span>Registrar coorientador</button>`}`;
  return h;
}
// Sessão agendada, reagendada ou em andamento bloqueia as trocas (RBN-CAD-10.6 / 10.7)
const defesaAtiva = (x) => S.defesas.some(d => d.tccId === x.id && ['Agendada', 'Reagendada', 'Em Andamento'].includes(d.status));
// RBN-CAD-10.6 / 08.6: se o novo orientador era coorientador do trabalho, a coorientação é encerrada
function encerrarCoorientacaoDe(x, docId) {
  const antes = x.coorientadores.length; x.coorientadores = x.coorientadores.filter(c => c.docenteId !== docId);
  if (x.coorientadores.length < antes) x.historicoOrientacao.push({ de: null, para: docId, ts: now().getTime(), motivo: `Coorientação de ${nomeMembro(docId)} encerrada: passou a ser o orientador` });
}
// RBN-CAD-10.1 / 10.6
const tituloOuAviso = (x) => x.titulo || 'Proposta ainda não registrada';
function indicarOrientador(tccId) {
  limparErros(); const x = tcc(tccId); const id = val('or_sel');
  if (!id) return erroCampo('or_sel', 'Selecione um docente.');
  if (defesaAtiva(x)) return toast('A troca de orientador só é permitida antes do agendamento da defesa.', 'erro');
  const d = docente(id), al = aluno(x.matricula);
  x.pedido = { docenteId: id, status: 'pendente', ts: now().getTime(), token: 'PED-' + token(), troca: !!x.orientadorId };
  notificar('d:' + id, `${al.nome} pediu sua orientação para "${tituloOuAviso(x)}".`, 'orientacoes');
  enviarEmail(d.email, 'SIGTCC — Pedido de orientação', `${al.nome} pediu sua orientação para "${tituloOuAviso(x)}". Aceite ou recuse pelo link.`, { tipo: 'pedido', token: x.pedido.token });
  auditar('Enviou pedido de orientação', `${al.nome} → ${d.nome}`); salvar(); render(); toast('Pedido enviado ao docente.', 'ok');
}
// RBN-CAD-10.1: cancelamento do pedido pendente pelo aluno; a lista volta a ficar disponível
function cancelarPedido(tccId) {
  const x = tcc(tccId); if (!x.pedido || x.pedido.status !== 'pendente') return;
  confirmar('Cancelar pedido?', `O pedido enviado a <b>${esc(nomeMembro(x.pedido.docenteId))}</b> será cancelado e a lista de orientador volta a ficar disponível.`, 'Cancelar Pedido', () => {
    x.pedido.status = 'cancelado'; x.pedido.respondidoEm = now().getTime();
    notificar('d:' + x.pedido.docenteId, `${aluno(x.matricula).nome} cancelou o pedido de orientação.`);
    auditar('Cancelou pedido de orientação', aluno(x.matricula).nome); salvar(); render(); toast('Pedido cancelado.', 'ok'); });
}
// RBN-CAD-10.2 e 10.6
function responderPedido(tccId, decisao, viaLink) {
  const x = tcc(tccId); if (!x.pedido || x.pedido.status !== 'pendente') return;
  const d = docente(x.pedido.docenteId), al = aluno(x.matricula), t = turma(x.turmaId);
  let fim;
  if (decisao === 'aceito' && x.orientadorId && defesaAtiva(x)) {
    // RBN-CAD-10.6: pedido de troca ainda pendente no agendamento é cancelado (salvaguarda; o agendamento já cancela)
    x.pedido.status = 'cancelado'; x.pedido.respondidoEm = now().getTime();
    notificar('d:' + d.id, `O pedido de troca de orientação de ${al.nome} foi cancelado: já existe sessão de defesa agendada. O orientador atual continua.`);
    notificar('a:' + x.matricula, `O pedido de troca de orientador foi cancelado porque já existe sessão de defesa agendada. Seu orientador continua ${nomeMembro(x.orientadorId)}.`, 'turma:' + t.id);
    fim = 'Pedido cancelado: já existe sessão de defesa agendada.';
  } else {
    x.pedido.status = decisao; x.pedido.respondidoEm = now().getTime();
    if (decisao === 'aceito') {
      const ant = x.orientadorId;
      if (ant) { x.historicoOrientacao.push({ de: ant, para: d.id, ts: now().getTime(), motivo: `Troca de orientador: ${nomeMembro(ant)} → ${d.nome}` }); notificar('d:' + ant, `${al.nome} passou a ser orientado(a) por ${d.nome}.`); }
      else x.historicoOrientacao.push({ de: null, para: d.id, ts: now().getTime(), motivo: `Orientação aceita por ${d.nome}` });
      x.orientadorId = d.id; encerrarCoorientacaoDe(x, d.id);
    }
    notificar('a:' + x.matricula, decisao === 'aceito' ? `${d.nome} aceitou orientar seu TCC.` : `${d.nome} recusou o pedido de orientação. Você pode indicar outro docente.`, 'turma:' + t.id);
    notificar('d:' + t.professorId, `${d.nome} ${decisao === 'aceito' ? 'aceitou' : 'recusou'} orientar ${al.nome}.`, 'turma:' + t.id);
    enviarEmail(docente(t.professorId).email, 'SIGTCC — Resposta a pedido de orientação', `${d.nome} ${decisao === 'aceito' ? 'aceitou' : 'recusou'} orientar ${al.nome} (${t.identificador}).`);
    fim = decisao === 'aceito' ? 'Orientação aceita.' : 'Pedido recusado.';
  }
  S.auditoria.unshift({ ts: now().getTime(), usuario: d.nome, acao: 'Respondeu pedido de orientação', detalhe: `${al.nome}: ${x.pedido.status}` });
  salvar();
  if (viaLink) $('app').innerHTML = `<div class="login-pg"><div class="login-card"><h1>Resposta registrada</h1><p class="sub">${esc(fim)}</p><p style="text-align:center"><a href="#" onclick="UI.publica=null;render();return false">Ir para o SIGTCC</a></p></div></div>`;
  else { render(); toast(fim, 'ok'); }
}
// RBN-CAD-10.3: coorientador Docente do NUCOMP (convite, RBN-CAD-10.4) ou Externo (registro)
function formCoorientador(tccId, depois) {
  const x = tcc(tccId);
  if (!x.orientadorId) return toast('Registre coorientadores depois de ter orientador vinculado.', 'erro');
  if (defesaAtiva(x)) return toast('Coorientadores só podem ser alterados antes do agendamento da defesa.', 'erro');
  const ops = docentesAtivos().filter(d => d.id !== x.orientadorId && !x.coorientadores.some(c => c.docenteId === d.id)).map(d => [d.id, `${d.nome} — ${d.titulacao} · ${d.curso}`]);
  abrirModal({ titulo: 'Registrar coorientador', icone: 'person_add', corpo: `${campo('co_tipo', 'Tipo *', { tipo: 'select', opcoes: ['Docente do NUCOMP', 'Externo ao NUCOMP'], attrs: `onchange="$('co_doc_box').hidden=this.value!=='Docente do NUCOMP';$('co_ext_box').hidden=this.value==='Docente do NUCOMP'"` })}
    <div id="co_doc_box">${campo('co_doc', 'Docente *', { tipo: 'select', opcoes: [['', 'Selecione…'], ...ops], dica: 'O docente recebe um convite para aceitar ou recusar.' })}</div>
    <div id="co_ext_box" hidden>${campo('co_nome', 'Nome Completo *', { max: 150 })}${campo('co_email', 'E-mail', { tipo: 'email', max: 100 })}${campo('co_inst', 'Instituição de Origem', { max: 150 })}</div>`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Registrar', cls: 'pri', acao: () => {
      limparErros(); let c;
      if (val('co_tipo') === 'Docente do NUCOMP') {
        const d = docente(val('co_doc')); if (!d) return erroCampo('co_doc', 'Selecione o docente.');
        c = { tipo: 'Docente', docenteId: d.id, nome: d.nome, email: d.email, instituicao: 'UEA · NUCOMP', status: 'pendente', token: 'COO-' + token() };
      } else {
        c = { tipo: 'Externo', docenteId: null, nome: val('co_nome'), email: val('co_email'), instituicao: val('co_inst'), status: 'registrado' };
        if (!NOME_OK.test(c.nome) || c.nome.length > 150) return erroCampo('co_nome', 'Use apenas letras, acentos e espaços (até 150).');
        if (c.email && (!EMAIL_OK.test(c.email) || c.email.length > 100)) return erroCampo('co_email', 'E-mail no formato nome@domínio (até 100).');
      }
      // RNF RAN-CAD-10: o mesmo docente ou e-mail não pode ser registrado duas vezes como coorientador
      if (x.coorientadores.some(o => (c.docenteId && o.docenteId === c.docenteId) || (c.email && o.email && normaliza(o.email) === normaliza(c.email)))) return erroCampo(c.docenteId ? 'co_doc' : 'co_email', 'Este coorientador já está registrado.');
      c.ts = now().getTime(); x.coorientadores.push(c);
      x.historicoOrientacao.push({ de: null, para: c.docenteId, ts: c.ts, motivo: c.tipo === 'Docente' ? `Convite de coorientação enviado a ${c.nome}` : `Coorientador externo registrado: ${c.nome}` });
      notificar('d:' + x.orientadorId, `${aluno(x.matricula).nome} registrou ${c.nome} como coorientador(a).`, 'orientacoes');      // RBN-CAD-10.3
      if (c.docenteId) { notificar('d:' + c.docenteId, `${aluno(x.matricula).nome} indicou você como coorientador(a) de "${x.titulo}".`, 'orientacoes');      // RBN-CAD-12.12
        enviarEmail(c.email, 'SIGTCC — Convite de coorientação', `${aluno(x.matricula).nome} indicou você como coorientador(a) de "${x.titulo}". Aceite ou recuse pelo link.`, { tipo: 'coorientacao', token: c.token }); }
      auditar('Registrou coorientador', c.nome); salvar(); render(); } }] });
}
// RBN-CAD-10.7 (Substituir e Remover) e 10.4 (cancelamento do convite pendente)
function removerCoorientador(tccId, i, modo) {
  const x = tcc(tccId); if (defesaAtiva(x)) return toast('Coorientadores só podem ser alterados antes do agendamento da defesa.', 'erro');
  const c = x.coorientadores[i];
  const exec = () => {
    x.coorientadores.splice(i, 1);
    x.historicoOrientacao.push({ de: c.docenteId, para: null, ts: now().getTime(), motivo: modo === 'cancelar' ? `Convite de coorientação a ${c.nome} cancelado pelo aluno` : `Coorientador ${modo === 'substituir' ? 'substituído' : 'removido'}: ${c.nome}` });
    if (modo !== 'cancelar') { notificar('d:' + x.orientadorId, `${aluno(x.matricula).nome} removeu ${c.nome} da coorientação.`, 'orientacoes'); if (c.docenteId) notificar('d:' + c.docenteId, `Você foi removido(a) da coorientação do TCC de ${aluno(x.matricula).nome}.`); }
    auditar('Removeu coorientador', c.nome); salvar(); render();
    if (modo === 'substituir') formCoorientador(tccId);
  };
  if (modo === 'cancelar') return exec();
  confirmar(modo === 'substituir' ? 'Substituir coorientador?' : 'Remover coorientador?', `${esc(c.nome)} deixa de ser coorientador(a) do trabalho.${modo === 'substituir' ? ' Em seguida, registre o novo coorientador.' : ''}`, modo === 'substituir' ? 'Substituir' : 'Remover', exec, true);
}
// RBN-CAD-10.4: aceite ou recusa do convite pelo docente
function responderCoorientacao(tccId, docId, aceita, viaLink) {
  const x = tcc(tccId); const c = x.coorientadores.find(y => y.docenteId === docId && y.status === 'pendente'); if (!c) return;
  if (aceita) {
    c.status = 'aceito'; c.respondidoEm = now().getTime();
    x.historicoOrientacao.push({ de: null, para: docId, ts: now().getTime(), motivo: `Coorientação aceita por ${c.nome}` });
    notificar('a:' + x.matricula, `${c.nome} aceitou a coorientação do seu TCC.`, 'turma:' + x.turmaId); notificar('d:' + x.orientadorId, `${c.nome} aceitou a coorientação do TCC de ${aluno(x.matricula).nome}.`, 'orientacoes');
  } else {
    x.coorientadores = x.coorientadores.filter(y => y !== c);
    x.historicoOrientacao.push({ de: null, para: null, ts: now().getTime(), motivo: `Coorientação recusada por ${c.nome}` });
    notificar('a:' + x.matricula, `${c.nome} recusou a coorientação. Você pode indicar outro coorientador.`, 'turma:' + x.turmaId);
  }
  S.auditoria.unshift({ ts: now().getTime(), usuario: c.nome, acao: 'Respondeu convite de coorientação', detalhe: `${aluno(x.matricula).nome}: ${aceita ? 'aceito' : 'recusado'}` }); salvar();
  if (viaLink) $('app').innerHTML = `<div class="login-pg"><div class="login-card"><h1>Resposta registrada</h1><p class="sub">Coorientação ${aceita ? 'aceita' : 'recusada'}.</p><p style="text-align:center"><a href="#" onclick="UI.publica=null;render();return false">Ir para o SIGTCC</a></p></div></div>`;
  else { render(); toast(aceita ? 'Coorientação aceita.' : 'Coorientação recusada.', 'ok'); }
}

/* ---------- Atas de orientação (RBN-CAD-11.1 e 11.2) ---------- */
// Pode registrar, editar e (exceto o aluno) comentar: Aluno, Orientador e Coorientador do NUCOMP com coorientação aceita
const participaAta = (x, u) => (u.tipo === 'aluno' && u.id === x.matricula && !bloqueado(x)) || u.id === x.orientadorId || ehCoorientadorDoTcc(x, u.id);
function formAta(tccId, ataId) {
  const a = ataId ? S.atas.find(y => y.id === ataId) : null; const x = tcc(tccId), u = me();
  if (turma(x.turmaId).arquivada || !participaAta(x, u)) return toast('Atas desta turma estão disponíveis apenas para consulta.', 'erro');
  abrirModal({ titulo: a ? 'Editar ata de orientação' : 'Registrar ata de orientação', icone: 'history_edu', tam: 'lg', corpo: `${campo('ata_data', 'Data do Encontro *', { tipo: 'date', valor: a?.data || hojeISO(), attrs: `max="${hojeISO()}"` })}
    ${campo('ata_pauta', 'Pauta Discutida *', { tipo: 'textarea', max: 2000, valor: a?.pauta || '' })}${campo('ata_metas', 'Metas Acordadas *', { tipo: 'textarea', max: 2000, valor: a?.metas || '' })}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Salvar', cls: 'pri', acao: () => {
      limparErros(); const d = { data: val('ata_data'), pauta: val('ata_pauta'), metas: val('ata_metas') };

      if (a) Object.assign(a, d, { editadaEm: now().getTime(), editadaPor: u.nome });
      else S.atas.push(Object.assign({ id: uid('at'), tccId, autor: u.id, comentarios: [], ts: now().getTime() }, d));
      auditar(a ? 'Editou ata de orientação' : 'Registrou ata de orientação', `${aluno(x.matricula).nome} — ${fmtData(d.data)}`); salvar(); render(); toast('Ata salva.', 'ok'); } }] });
}
function verAtas(tccId) {
  const x = tcc(tccId), u = me(); const atas = S.atas.filter(a => a.tccId === tccId).sort((a, b) => b.data.localeCompare(a.data));
  const edita = !turma(x.turmaId).arquivada && participaAta(x, u); const comenta = edita && u.tipo !== 'aluno';
  abrirModal({ titulo: 'Atas — ' + aluno(x.matricula).nome, icone: 'history_edu', tam: 'lg', corpo: `<p class="muted">${esc(x.titulo)}${x.orientadorId ? ' · Orientador: ' + esc(nomeMembro(x.orientadorId)) : ''}</p>
    ${atas.map(a => `<div class="box mb8"><div class="flex entre"><b>${fmtData(a.data)}</b><small class="muted">registrada por ${esc(autorAta(a.autor))}${a.editadaEm ? ' · editada por ' + esc(a.editadaPor) : ''}</small></div>
      <p style="margin:8px 0 4px"><b style="font-weight:500">Pauta Discutida:</b> ${esc(a.pauta)}</p><p style="margin:0"><b style="font-weight:500">Metas Acordadas:</b> ${esc(a.metas)}</p>
      ${a.comentarios.map(c => `<div class="alerta info mt8" style="margin-bottom:0"><span class="ms">comment</span><div>${esc(c.texto)}<br><small>${esc(autorAta(c.autor))} · ${fmtDH(c.ts)}</small></div></div>`).join('')}
      <div class="flex mt8">${edita ? `<button class="btn txt" onclick="fecharTodosModais();formAta('${tccId}','${a.id}')">Editar</button>` : ''}${comenta ? `<button class="btn txt" onclick="comentarAta('${a.id}')">Comentar</button>` : ''}</div></div>`).join('') || '<div class="vazio"><span class="ms">event_busy</span>Nenhum encontro registrado.</div>'}` });
}
function comentarAta(ataId) {

/* ---------- Publicação do artigo (RBN-CAD-12.1), preenchida pelo Aluno ou pelo Orientador ---------- */
function formPublicacao(x, ro) {
  const p = x.publicacao || { veiculo: '', link: '', qualis: '', status: '' };
  return `${x.publicacao ? `<p>Aproveitamento: ${aproveitamento(x.publicacao)}</p>` : ''}
    <div class="linha2">${campo('pb_veic', 'Veículo de Publicação', { valor: p.veiculo, max: 150, desab: ro })}${campo('pb_link', 'Link ou DOI *', { valor: p.link, max: 500, desab: ro, ph: 'https://doi.org/…' })}</div>
    <div class="linha2">${campo('pb_qualis', 'Estrato Qualis/CAPES *', { tipo: 'select', opcoes: [['', 'Selecione…'], ...QUALIS], valor: p.qualis, desab: ro })}${campo('pb_status', 'Status de Submissão *', { tipo: 'select', opcoes: [['', 'Selecione…'], ...STATUS_SUB], valor: p.status, desab: ro })}</div>
    ${ro ? '' : `<button class="btn pri" onclick="salvarPublicacao('${x.id}')"><span class="ms">save</span>Salvar publicação</button>`}`;
}
function salvarPublicacao(tccId) {
  limparErros(); const x = tcc(tccId);
  const n = { veiculo: val('pb_veic'), link: val('pb_link'), qualis: val('pb_qualis'), status: val('pb_status') };
  if (!urlHttps(n.link) || n.link.length > 500) return erroCampo('pb_link', 'Informe um endereço iniciado por https:// (até 500 caracteres).');
  if (!n.qualis) return erroCampo('pb_qualis', 'Selecione o Estrato Qualis/CAPES.');
  if (!n.status) return erroCampo('pb_status', 'Selecione o Status de Submissão.');
  const p = x.publicacao || {};
  // RBN-CAD-12.3: alteração de Qualis, status ou link de artigo já analisado desfaz a decisão
  const desfaz = p.homologacao && (p.qualis !== n.qualis || p.link !== n.link || p.status !== n.status);
  x.publicacao = Object.assign(p, n);
  if (desfaz) { p.homologacao = null; p.homologadoPor = null; p.homologadoEm = null; }
  auditar('Registrou publicação', n.veiculo); salvar(); render(); toast(desfaz ? 'Publicação salva. A análise do aproveitamento foi desfeita e o artigo volta para análise.' : 'Publicação salva.', 'ok');
}
/* ---------- Painel de análise do aproveitamento (RBN-CAD-12.2 / 12.3) ---------- */
function viewArtigos() {
  if (!ehCoord()) return '<div class="vazio">Acesso restrito ao Coordenador de Curso.</div>';
  const l = S.tccs.filter(x => x.modalidade === 'Artigo Científico' && x.publicacao && ['Aceito', 'Publicado'].includes(x.publicacao.status) && passaCurso(cursoDoTcc(x)));
  // Decisão possível até a liberação do resultado da defesa do trabalho, apenas para o curso do Coordenador
  const podeDecidir = (x) => meuCurso(cursoDoTcc(x)) && !S.defesas.some(d => d.tccId === x.id && d.liberadoEm);
  return `<div class="wrap-lg"><h2 class="pg">Aproveitamento de artigos</h2><p class="pg-sub">Artigos com Status de Submissão Aceito ou Publicado. Homologação em Qualis A ou B garante nota final mínima 6,0 em TCC 1 e em TCC 2; a apresentação perante a banca continua obrigatória.</p>
    <div class="filtros">${selCurso()}</div>
    <div class="tabela-wrap"><table class="tb"><thead><tr><th>Aluno</th><th>Orientador</th><th>Título do TCC</th><th>Veículo de Publicação</th><th>Estrato Qualis/CAPES</th><th>Link ou DOI</th><th>Aproveitamento</th><th></th></tr></thead><tbody>
    ${l.map(x => { const p = x.publicacao; return `<tr><td>${esc(aluno(x.matricula).nome)}</td><td>${esc(nomeMembro(x.orientadorId))}</td><td>${esc(x.titulo)}</td><td>${esc(p.veiculo || '—')}</td>
      <td>${esc(p.qualis)}</td><td><a href="${esc(p.link)}" target="_blank" rel="noopener">abrir</a></td><td>${aproveitamento(p)}</td>
      <td>${podeDecidir(x) ? `<div class="acoes">${p.homologacao !== 'Homologado' ? `<button class="btn pri" onclick="decidirArtigo('${x.id}','Homologado')">Homologar</button>` : ''}${p.homologacao !== 'Recusado' ? `<button class="btn perigo" onclick="decidirArtigo('${x.id}','Recusado')">Recusar</button>` : ''}</div>` : ''}</td></tr>`; }).join('') || '<tr><td colspan="8" class="muted">Nenhum artigo Aceito ou Publicado.</td></tr>'}
    </tbody></table></div></div>`;
}
function decidirArtigo(tccId, dec) {
  const x = tcc(tccId);
  confirmar(dec === 'Homologado' ? 'Homologar aproveitamento?' : 'Recusar aproveitamento?', `${esc(aluno(x.matricula).nome)} · ${esc(x.publicacao.veiculo || '')} · Qualis ${esc(x.publicacao.qualis)}.`, dec === 'Homologado' ? 'Homologar' : 'Recusar', () => {
    Object.assign(x.publicacao, { homologacao: dec, homologadoPor: me().nome, homologadoEm: now().getTime() });
    auditar(dec === 'Homologado' ? 'Homologou aproveitamento de artigo' : 'Recusou aproveitamento de artigo', aluno(x.matricula).nome); salvar(); render(); }, dec !== 'Homologado');
}

// RBN-CAD-09.5 / 09.6: encerramento da participação pelo Professor da Disciplina

  const x = tcc(tccId);
  abrirModal({ titulo: 'Encerrar participação do aluno', icone: 'block', corpo: `<p><b>${esc(aluno(x.matricula).nome)}</b>${x.titulo ? ' — ' + esc(x.titulo) : ''}</p>${campo('enc_sit', 'Status *', { tipo: 'select', opcoes: [['', 'Selecione…'], 'Desistente', 'Reprovado', 'Jubilado'] })}${campo('enc_just', 'Justificativa *', { tipo: 'textarea', max: 500 })}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Encerrar', cls: 'pri perigo', acao: () => {
      limparErros(); const s = val('enc_sit'), j = val('enc_just'); if (!s) return erroCampo('enc_sit', 'Escolha o Status.'); if (!j) return erroCampo('enc_just', 'A justificativa é obrigatória.');
      x.encerramento = { situacao: s, justificativa: j, por: me().nome, ts: now().getTime() }; mudarSituacao(x, s, 'Registro do Professor da Disciplina: ' + j);

}

  const id = me().id;
  const pedidos = S.tccs.filter(x => x.pedido && x.pedido.status === 'pendente' && x.pedido.docenteId === id);

  const l = S.tccs.filter(x => (x.orientadorId === id || ehCoorientadorDoTcc(x, id)) && turma(x.turmaId).alunos.includes(x.matricula))
    .sort((a, b) => (turma(a.turmaId).arquivada ? 1 : 0) - (turma(b.turmaId).arquivada ? 1 : 0) || aluno(a.matricula).nome.localeCompare(aluno(b.matricula).nome));
  return `<div class="wrap-lg"><h2 class="pg">Orientações</h2>

      <div class="acoes">${temProposta(x) ? `<button class="btn txt" onclick="abrirModal({titulo:'Proposta',corpo:fichaTcc(tcc('${x.id}'))})">Ver Proposta</button>` : ''}<button class="btn perigo" onclick="responderPedido('${x.id}','recusado')">Recusar</button><button class="btn pri" onclick="responderPedido('${x.id}','aceito')">Aceitar</button></div></div>`).join('')}` : ''}
    ${convites.length ? `<div class="sec-tit c-azul">Convites de coorientação</div>${convites.map(x => `<div class="item">${avatar(aluno(x.matricula).nome, null, 'md')}<div class="corpo"><b>${esc(aluno(x.matricula).nome)} — ${esc(x.titulo)}</b><small>${esc(turma(x.turmaId).identificador)} · Orientador: ${esc(nomeMembro(x.orientadorId))}</small></div>
      <div class="acoes"><button class="btn perigo" onclick="responderCoorientacao('${x.id}','${id}',false)">Recusar</button><button class="btn pri" onclick="responderCoorientacao('${x.id}','${id}',true)">Aceitar</button></div></div>`).join('')}` : ''}
    <div class="sec-tit c-azul">Painel de orientandos</div>
    <div class="tabela-wrap"><table class="tb"><thead><tr><th>Nome do Aluno</th><th>Curso</th><th>Turma</th><th>Título</th><th>Modalidade</th><th>Papel</th><th>Status do TCC</th><th>Status das entregas</th><th>Atas e ações</th></tr></thead><tbody>
    ${l.map(x => { const t = turma(x.turmaId); const df = defesaDoTcc(x.id); const orient = x.orientadorId === id; const ativ = S.atividades.filter(a => a.turmaId === t.id);
      // RBN-CAD-09.5: em SI, com Aprovado com Correções, o Orientador clica em Correções Conferidas depois do envio da Versão Final
      const podeConfirmar = orient && precisaConferir(x, df) && x.situacao === 'Aprovado com Correções' && ['Entregue', 'Entregue com Atraso'].includes(statusVF(x));
      const semDoc = !ativDocumento(t.id); const aptoOk = x.situacao === 'Em Andamento' && documentoEntregue(x) && x.area && x.palavras.length;
      return `<tr><td>${esc(aluno(x.matricula).nome)}</td><td>${esc(t.curso)}</td><td>${esc(t.descricao)} · ${esc(t.identificador)}</td><td>${temProposta(x) ? esc(x.titulo) : '<span class="muted">Sem Proposta</span>'}</td><td>${esc(x.modalidade)}</td><td>${orient ? 'Orientador' : 'Coorientador'}</td><td>${chipSit(x.situacao)}</td>
        <td><small>${ativ.map(a => `${esc(a.titulo)}: ${statusEnvio(a, x.matricula)}`).join('<br>') || '—'}</small></td>
        <td><div class="acoes"><button class="btn txt" onclick="verAtas('${x.id}')">Atas (${S.atas.filter(a => a.tccId === x.id).length})</button>${!t.arquivada && participaAta(x, me()) ? `<button class="btn txt" onclick="formAta('${x.id}')">Registrar ata</button>` : ''}
        ${orient ? `<button class="btn txt" onclick="verHistoricoSituacao('${x.id}')">Histórico</button>` : ''}
        ${orient && !t.arquivada && x.situacao === 'Em Andamento' ? `<button class="btn" ${aptoOk ? `onclick="marcarApto('${x.id}')"` : `disabled title="${semDoc ? 'A entrega do tipo Documento para Defesa precisa ser cadastrada pelo Professor da Disciplina' : 'Requer a entrega do tipo Documento para Defesa com status Entregue ou Entregue com Atraso, Área de Interesse e ao menos uma Palavra-Chave'}"`}>Apto para Defesa</button>${semDoc ? '<small class="muted" style="display:block">A entrega do tipo Documento para Defesa precisa ser cadastrada pelo Professor da Disciplina.</small>' : ''}` : ''}

    </tbody></table></div></div>`;
}
// RBN-CAD-12.1: o Orientador também preenche e atualiza a publicação
function abrirPublicacao(tccId) { const x = tcc(tccId); abrirModal({ titulo: 'Publicação do artigo — ' + aluno(x.matricula).nome, icone: 'article', tam: 'lg', corpo: formPublicacao(x, false), botoes: [{ txt: 'Fechar' }] }); }
// RBN-CAD-11.5: Apto para Defesa
function marcarApto(tccId) {
  const x = tcc(tccId);
  if (!ativDocumento(x.turmaId)) return toast('A turma não tem entrega do tipo Documento para Defesa: ela precisa ser cadastrada pelo Professor da Disciplina.', 'erro');
  if (!documentoEntregue(x)) return toast('A entrega do tipo Documento para Defesa precisa estar com status Entregue ou Entregue com Atraso.', 'erro');
  if (!x.area || !x.palavras.length) return toast('Área de Interesse e ao menos uma Palavra-Chave precisam estar preenchidas.', 'erro');
  confirmar('Apto para Defesa?', `O TCC de <b>${esc(aluno(x.matricula).nome)}</b> passará para o Status do TCC <b>Apto para Defesa</b>.`, 'Confirmar', () => {
    mudarSituacao(x, 'Apto para Defesa', 'Indicação do Orientador'); salvar(); render(); });
}
// RBN-CAD-09.5: em Sistemas de Informação (Professor da Disciplina não é o Orientador), com Aprovado com Correções,
// o Orientador clica em Correções Conferidas antes de o Homologar ficar disponível ao professor
const precisaConferir = (x, df) => { const t = turma(x.turmaId); return t.descricao === 'TCC 2' && t.curso === 'Sistemas de Informação' && !!df?.liberadoEm && df.resultado?.parecer === 'Aprovado com Correções'; };
function confirmarCorrecoes(tccId) {
  const x = tcc(tccId);
  confirmar('Correções Conferidas?', `Confirma que conferiu, na Versão Final de <b>${esc(aluno(x.matricula).nome)}</b>, as correções pedidas pela banca? O botão Homologar passa a ficar disponível ao Professor da Disciplina.`, 'Confirmar', () => {
    x.correcoesConfirmadas = { ts: now().getTime(), por: me().nome }; auditar('Correções Conferidas', aluno(x.matricula).nome);
    const t = turma(x.turmaId); notificar('d:' + t.professorId, `${me().nome} conferiu as correções da Versão Final de ${aluno(x.matricula).nome}: a homologação está disponível.`, 'turma:' + t.id);
    salvar(); render(); });
}

/* ---------- Versão Final do TCC 2 (RBN-CAD-09.2, 09.3 e 09.5) ----------
   A Versão Final é a entrega do tipo Versão Final da turma; a Data Limite é a dessa entrega. */
function podeEnviarVF(x, df) {
  const t = turma(x.turmaId); const a = ativVF(t.id); const vf = x.versaoFinal;
  if (t.descricao !== 'TCC 2' || t.arquivada || !a || !df || !df.liberadoEm) return false;
  if (!['Aprovado', 'Aprovado com Correções'].includes(x.situacao)) return false;      // após a liberação do resultado
  if (vf?.decisao === 'Homologada') return false;
  if (vf?.link && !vf.decisao) return !passouPrazo(a);                                  // substituição só até a Data Limite
  return true;                                                                          // primeiro envio (mesmo atrasado) ou reenvio após devolução
}
function enviarVersaoFinal(tccId) {
  limparErros(); const x = tcc(tccId), t = turma(x.turmaId); const a = ativVF(t.id); const link = val('vf_link');
  if (!podeEnviarVF(x, defesaDoTcc(x.id))) { toast('Envio da Versão Final indisponível.', 'erro'); return false; }
  if (!urlHttps(link) || link.length > 500) return erroCampo('vf_link', 'Informe um endereço iniciado por https:// (até 500 caracteres).');
  const vf = x.versaoFinal; const agora = now().getTime(); const subst = !!(vf?.link && !vf.decisao);
  if (subst) Object.assign(vf, { link, ultimoEm: agora, historico: [...(vf.historico || []), { link, ts: agora }] });      // vale a data do primeiro envio
  else x.versaoFinal = { link, ts: agora, ultimoEm: agora, atraso: passouPrazo(a), decisao: null, msg: vf?.msg || '', historico: [...(vf?.historico || []), { link, ts: agora }] };   // no reenvio, conforme a Data Limite
  notificar('d:' + t.professorId, `${aluno(x.matricula).nome} ${subst ? 'substituiu o link' : 'enviou o link'} da Versão Final (${t.identificador}).`, 'turma:' + t.id);   // RBN-CAD-09.6
  auditar(subst ? 'Substituiu link da Versão Final' : 'Enviou Versão Final', aluno(x.matricula).nome); salvar(); render();
  toast(subst ? 'Link substituído.' : x.versaoFinal.atraso ? 'Versão Final enviada: Entregue com Atraso.' : 'Versão Final enviada.', 'ok'); return true;
}
// RBN-CAD-09.5: Homologar ou Devolver para Ajuste
function formHomologarVF(tccId) {
  const x = tcc(tccId); const vf = x.versaoFinal; const df = defesaDoTcc(x.id); const t = turma(x.turmaId);
  const aguardando = precisaConferir(x, df) && !x.correcoesConfirmadas;
  const nota = aguardando ? '<div class="alerta aviso mt16"><span class="ms">hourglass_top</span><div>Parecer Aprovado com Correções em Sistemas de Informação: o Homologar fica disponível depois que o Orientador clicar em Correções Conferidas.</div></div>'
    : df?.resultado?.parecer === 'Aprovado com Correções' ? `<div class="alerta info mt16"><span class="ms">info</span><div>${x.correcoesConfirmadas ? `Correções Conferidas pelo Orientador ${esc(x.correcoesConfirmadas.por)} em ${fmtDH(x.correcoesConfirmadas.ts)}. ` : ''}Ao homologar, você confirma a Versão Final e o cumprimento das correções pedidas pela banca.</div></div>` : '';
  abrirModal({ titulo: 'Homologar ou devolver a Versão Final', icone: 'verified', corpo: `${fichaTcc(x)}
    <p class="mt16">Link da Versão Final: <a href="${esc(vf.link)}" target="_blank" rel="noopener">${esc(vf.link)}</a><br><small class="muted">Primeiro envio em ${fmtDH(vf.ts)} · ${statusVF(x)}</small></p>${nota}
    ${campo('vf_msg', 'Mensagem ao aluno (obrigatória para Devolver para Ajuste)', { tipo: 'textarea', max: 500 })}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Devolver para Ajuste', acao: () => { if (!val('vf_msg')) return erroCampo('vf_msg', 'Escreva a mensagem ao aluno.'); decidirVF(tccId, 'Devolvida para Ajuste', val('vf_msg')); } },
      { txt: 'Homologar', cls: 'pri', desab: aguardando, acao: () => decidirVF(tccId, 'Homologada') }] });
}
function decidirVF(tccId, dec, msg) {
  const x = tcc(tccId), t = turma(x.turmaId);
  if (dec === 'Homologada' && precisaConferir(x, defesaDoTcc(x.id)) && !x.correcoesConfirmadas) { toast('Aguardando o Orientador clicar em Correções Conferidas.', 'erro'); return false; }
  Object.assign(x.versaoFinal, { decisao: dec, decididoEm: now().getTime(), decididoPor: me().nome, msg: msg || '' });
  if (dec === 'Homologada') { mudarSituacao(x, 'Concluído', 'Homologação da Versão Final');
    notificar('a:' + x.matricula, 'Sua Versão Final foi homologada. Status do TCC: Concluído.', 'turma:' + t.id);
    S.secretarias.filter(s => s.curso === t.curso && s.ativo !== false).forEach(s => notificar('s:' + s.id, `TCC de ${aluno(x.matricula).nome} (${x.matricula}) concluído: Versão Final homologada. Conclua os trâmites acadêmicos.`)); }
  if (dec === 'Devolvida para Ajuste') notificar('a:' + x.matricula, `Versão Final devolvida para ajuste: ${msg}. Corrija e reenvie o link.`, 'turma:' + t.id);
  auditar(dec === 'Homologada' ? 'Homologou a Versão Final' : 'Devolveu a Versão Final para ajuste', aluno(x.matricula).nome); salvar(); render(); toast('Decisão registrada.', 'ok');
}
/* =====================================================================
   PARTE 5 — DEFESA: AGENDAMENTO, BANCA, CRITÉRIOS, AVALIAÇÃO,
             RESULTADO, DOCUMENTOS, OUVINTES E OCORRÊNCIAS (RAN-DEF-01 a 08)
   ===================================================================== */

const ATIVAS = ['Agendada', 'Reagendada', 'Em Andamento'];
const corStatus = { 'Agendada': 'azul', 'Reagendada': 'azul', 'Em Andamento': 'amarelo', 'Realizada': 'verde', 'Cancelada': 'vermelho' };
const chipStatus = (s) => `<span class="chip ${corStatus[s] || ''}">${esc(s)}</span>`;
const localDef = (df) => df.formato === 'Presencial' ? df.local : df.link;

/* ---------- Regras de agendamento ---------- */
// RBN-DEF-01.8: ECP → apenas o Orientador; SI e LC → apenas o Professor da Disciplina (curso da turma)
function quemAgenda(x) { const t = turma(x.turmaId); return t.curso === 'Engenharia de Computação' ? x.orientadorId : t.professorId; }
function podeAgendar(x) { return ehDocente() && quemAgenda(x) === me().id; }
// RBN-DEF-01.1: Apto para Defesa, Entrega do Documento Entregue ou Entregue com Atraso, sem sessão Agendada, Reagendada ou Em Andamento
const elegivel = (x) => x.situacao === 'Apto para Defesa' && documentoEntregue(x) && !defesaAtiva(x) && !turma(x.turmaId).arquivada;
function elegiveis() { return S.tccs.filter(x => elegivel(x) && podeAgendar(x)); }
// RBN-DEF-03.3: Reagendar e Cancelar pelo perfil autorizado a agendar e pela Secretaria do curso do trabalho
function podeGerirSessao(df) { const x = tcc(df.tccId); return ATIVAS.includes(df.status) && !df.liberadoEm && (podeAgendar(x) || (ehSecretaria() && me().reg.curso === cursoDoTcc(x))); }
// RBN-DEF-02.3: Docentes ativos e Membros Externos cadastrados, sem o orientador e os coorientadores do trabalho
function candidatosBanca(x) {
  const ehCo = (p) => x.coorientadores.some(c => c.docenteId === p.id || (c.email && normaliza(c.email) === normaliza(p.email)));
  return [...docentesAtivos().filter(d => d.id !== x.orientadorId && !ehCo(d)).map(d => [d.id, `${d.nome} (${d.titulacao} · Docente)`]),
  ...S.externos.filter(e => !ehCo(e)).map(e => [e.id, `${e.nome} (${e.titulacao} · ${e.instituicao})`])];
}

/* ---------- RBN-DEF-01.10: filtro de período das defesas ----------
   Data Inicial e Data Final, com atalhos Período Letivo (ano e semestre da turma), Esta Semana, Este Mês e Próximos 30 Dias.
   Por padrão, o período letivo atual. */
const semestres = () => [...new Set(S.turmas.map(semestreDe))].sort().reverse();
const semAtual = () => { const d = now(); return d.getFullYear() + '/' + (d.getMonth() < 6 ? 1 : 2); };
function periodo() {
  const f = UI.f; if (!f.per_at) { f.per_at = 'letivo'; f.per_sem = semestres().includes(semAtual()) ? semAtual() : semestres()[0]; f.per_ini = ''; f.per_fim = ''; }
  return f;
}
function aplicarAtalho(at) {
  const f = periodo(); const h = hojeISO(); f.per_at = at;
  if (at === 'semana') { const d = new Date(h + 'T12:00:00'); f.per_ini = addDias(h, -((d.getDay() + 6) % 7)); f.per_fim = addDias(f.per_ini, 6); }
  else if (at === 'mes') { const [a, m] = h.split('-').map(Number); f.per_ini = h.slice(0, 8) + '01'; f.per_fim = isoData(new Date(a, m, 0, 12)); }
  else if (at === 'prox30') { f.per_ini = h; f.per_fim = addDias(h, 30); }
  else if (at === 'letivo') { f.per_ini = ''; f.per_fim = ''; }
  render();
}
function mudarData(k, v) { const f = periodo(); f[k] = v; f.per_at = 'datas'; render(); }
function selPeriodo() {
  const f = periodo();
  const ops = [['letivo', 'Período Letivo'], ['semana', 'Esta Semana'], ['mes', 'Este Mês'], ['prox30', 'Próximos 30 Dias'], ...(f.per_at === 'datas' ? [['datas', 'Datas informadas']] : [])];
  return `<div class="campo"><label for="f_per_at">Período</label><select class="inp" id="f_per_at" onchange="aplicarAtalho(this.value)">${ops.map(([v, t]) => `<option value="${v}" ${f.per_at === v ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
    ${f.per_at === 'letivo' ? `<div class="campo"><label for="f_per_sem">Ano/Semestre</label><select class="inp" id="f_per_sem" onchange="UI.f.per_sem=this.value;render()">${semestres().map(s => `<option ${s === f.per_sem ? 'selected' : ''}>${s}</option>`).join('')}</select></div>` : ''}
    <div class="campo"><label for="f_per_ini">Data Inicial</label><input class="inp" type="date" id="f_per_ini" value="${esc(f.per_ini)}" onchange="mudarData('per_ini',this.value)"></div>
    <div class="campo"><label for="f_per_fim">Data Final</label><input class="inp" type="date" id="f_per_fim" value="${esc(f.per_fim)}" onchange="mudarData('per_fim',this.value)"></div>`;
}
function passaPeriodo(df) {
  const f = periodo();
  if (f.per_at === 'letivo') return semestreDe(turma(tcc(df.tccId).turmaId)) === f.per_sem;
  return (!f.per_ini || df.data >= f.per_ini) && (!f.per_fim || df.data <= f.per_fim);
}

// RBN-DEF-03.1: verifica de uma só vez a sobreposição de membros no intervalo de 1 hora (o Local, texto livre, não entra)
function conflitos(data, inicio, formato, local, pessoas, ignorarId) {
  const fim = somaHora(inicio, 60); const sobre = (o) => o.data === data && minutos(o.inicio) < minutos(fim) && minutos(inicio) < minutos(o.fim);

  if (emConflito.length) msgs.push('Conflito de horário com outra sessão: ' + emConflito.map(nomeMembro).join(', ') + '.');
  return msgs;
}
function salvarAgendamento(reagendarId) {

  if (lib) h += blocoResultado(df);
  // RBN-DEF-08.6: Ocorrências (Orientador preenche; Secretaria e Professor da Disciplina leem)
  if (df.ocorrencias && (souOrient || donoTurma(t) || ehSecretaria())) h += `<h4 style="font-weight:500">Ocorrências</h4><p style="white-space:pre-wrap">${esc(df.ocorrencias)}</p>`;
  if (df.ouvintes.length && (souOrient || donoTurma(t) || ehSecretaria())) h += `<h4 style="font-weight:500">Ouvintes (${df.ouvintes.length})</h4><p class="muted">${df.ouvintes.map(o => esc(o.nome + ' — ' + o.matricula)).join('<br>')}</p>`;

  const bt = []; const gerir = podeGerirSessao(df);
  if (souMembro && ATIVAS.includes(df.status) && !lib) bt.push({ txt: df.avaliacoes[u.id]?.enviado ? 'Reabrir minha avaliação' : 'Avaliar', cls: 'pri', acao: () => { setTimeout(() => formAvaliacao(id)); } });
  if (souOrient && df.resultado && !lib && t.descricao === 'TCC 2' && df.resultado.final >= 6) bt.push({ txt: 'Registrar parecer', acao: () => { setTimeout(() => formParecer(id)); } });
  if (souOrient && df.resultado && df.resultado.parecer && !lib) bt.push({ txt: 'Liberar Resultado', cls: 'pri', acao: () => { setTimeout(() => liberarResultado(id)); } });
  if (souOrient && df.status === 'Em Andamento' && df.banca.suplente && !df.banca.acionamento && !lib) bt.push({ txt: 'Acionar suplente', acao: () => { setTimeout(() => formSuplente(id)); } });
  if (souOrient && ['Em Andamento', 'Realizada'].includes(df.status) && !lib) bt.push({ txt: 'Ocorrências', acao: () => { setTimeout(() => formOcorrencias(id)); } });
  if ((souOrient || donoTurma(t)) && ['Em Andamento', 'Realizada'].includes(df.status)) bt.push({ txt: 'Ouvintes', acao: () => { setTimeout(() => formOuvintes(id)); } });
  if (lib && acessaDocs(df)) { bt.push({ txt: 'Ata Final (PDF)', acao: () => { setTimeout(() => pdfAta(id)); } }); if (temFolha(x, df)) bt.push({ txt: 'Folha de Aprovação (PDF)', acao: () => { setTimeout(() => pdfFolha(id)); } }); }
  if (lib && df.declaracoes.some(d => d.membro === u.id)) bt.push({ txt: 'Minha declaração', acao: () => { setTimeout(() => pdfDeclaracao(id, u.id)); } });
  if (podeAgendar(x) && ['Agendada', 'Reagendada'].includes(df.status)) bt.push({ txt: 'Alterar banca', acao: () => { setTimeout(() => formAlterarBanca(id)); } });
  if (gerir) { bt.push({ txt: 'Reagendar', acao: () => { setTimeout(() => formAgendar(null, null, id)); } }); bt.push({ txt: 'Cancelar sessão', cls: 'perigo', acao: () => { setTimeout(() => cancelarDefesa(id)); } }); }
  bt.push({ txt: 'Histórico', acao: () => { setTimeout(() => verHistoricoDefesa(x.id)); } });
  bt.push({ txt: 'Fechar' });
  abrirModal({ titulo: 'Sessão de defesa', icone: 'gavel', tam: 'lg', corpo: h, botoes: bt });
}

/* ---------- Formulário de avaliação (RBN-DEF-05.1 a 05.6) ---------- */
function formAvaliacao(id) {

  const linha = (c) => { const v = av.valores[c.id] || {}; const bloq = c.comp === 'Parte Oral' && !oralLiberada;
    return `<div class="crit ${bloq ? 'bloq' : ''}"><div class="crit-cab"><div><b>${esc(c.nome)}</b> <span class="chip">peso ${fmtNota(c.peso)}</span></div></div>
      <div class="nota-linha mt8">${campo('cc_' + c.id, 'Conceito', { tipo: 'select', opcoes: [['', 'Selecione…'], ...CONCEITOS.map(k => [k[0], k[0]])], valor: v.conceito || '', desab: bloq, attrs: `onchange="dicaFaixa('${c.id}')"` })}
      ${campo('nt_' + c.id, 'Nota', { valor: v.nota != null ? fmtNota(v.nota) : '', desab: bloq, attrs: `inputmode="decimal" oninput="dicaFaixa('${c.id}')"`, dica: '<span id="fx_' + c.id + '"></span>' })}
      ${campo('ob_' + c.id, 'Observações', { valor: v.obs || '', max: 500, desab: bloq })}</div>
      <details><summary class="muted" style="cursor:pointer;font-size:12px">Descrições dos conceitos</summary><div class="niveis">${[['ex', 'Exemplar · 8,0 a 10,0'], ['co', 'Competente · 6,0 a 7,9'], ['ne', 'Necessita de Trabalho · 0,0 a 5,9']].map(([k, n]) => `<div class="nivel"><b>${n}</b>${esc(c[k])}</div>`).join('')}</div></details></div>`; };
  const perfilAss = membro(u.id).assinatura; const doc = linkDocumento(x);
  abrirModal({ titulo: 'Avaliação — ' + aluno(x.matricula).nome, icone: 'rate_review', tam: 'xl', corpo: `<p class="muted">${esc(x.titulo)} · ${papelNaBanca(df, u.id)}</p>
    ${doc ? `<a class="btn mb16" href="${esc(doc)}" target="_blank" rel="noopener"><span class="ms">description</span>Documento entregue</a>` : ''}
    ${oralLiberada ? '' : `<div class="alerta info"><span class="ms">schedule</span><div>Com a sessão ${esc(df.status)}, apenas a Parte Escrita pode ser avaliada e salva. A Parte Oral e o envio ficam disponíveis com a sessão Em Andamento.</div></div>`}
    <h4 style="font-weight:500">Parte Escrita (peso 7,0)</h4>${CRITERIOS.filter(c => c.comp === 'Parte Escrita').map(linha).join('')}
    <h4 style="font-weight:500">Parte Oral (peso 3,0)</h4>${CRITERIOS.filter(c => c.comp === 'Parte Oral').map(linha).join('')}
    ${oralLiberada ? `<div class="sec-tit c-azul" style="font-size:20px">Assinatura do Membro da Banca</div>
      ${perfilAss ? `<label class="check"><input type="checkbox" id="as_perfil" checked>Reutilizar a assinatura salva no meu perfil</label><img class="assin" src="${perfilAss}" alt="Assinatura salva">` : ''}
      <div class="flex mt8"><label class="btn"><span class="ms">upload</span>Anexar imagem (PNG ou JPG, até 2 MB)<input type="file" accept="image/png,image/jpeg" hidden onchange="lerAssinatura(this,v=>{window._assNova=v;$('as_prev').innerHTML='<img class=&quot;assin&quot; src=&quot;'+v+'&quot;>';if($('as_perfil'))$('as_perfil').checked=false;})"></label><span id="as_prev"></span></div>
      <label class="check"><input type="checkbox" id="as_salvar">Salvar esta imagem no meu perfil</label>` : ''}`,
    botoes: [{ txt: 'Cancelar' }, { txt: 'Salvar', acao: () => salvarAvaliacao(id, false) }, ...(oralLiberada ? [{ txt: 'Enviar avaliação assinada', cls: 'pri', acao: () => salvarAvaliacao(id, true) }] : [])] });
  window._assNova = null; CRITERIOS.forEach(c => dicaFaixa(c.id));
}
// RBN-DEF-05.3: nota aceita apenas dentro da faixa do conceito escolhido
function dicaFaixa(cid) {
  const c = val('cc_' + cid), el = $('nt_' + cid), fx = $('fx_' + cid); if (!el || !fx) return;
  const f = faixaDe(c); fx.textContent = f ? `faixa ${fmtNota(f[1])} a ${fmtNota(f[2])}` : 'escolha o conceito';
  const n = lerNota(el.value); el.classList.toggle('erro', el.value !== '' && (isNaN(n) || !f || n < f[1] || n > f[2]));
}
function salvarAvaliacao(id, enviar) {
  limparErros(); const df = defesa(id), u = me(); const oral = df.status === 'Em Andamento';
  if (!ATIVAS.includes(df.status) || df.liberadoEm) { toast('A avaliação está bloqueada.', 'erro'); return false; }
  const valores = {}; let primeiroErro = null;
  for (const c of CRITERIOS) {
    if (c.comp === 'Parte Oral' && !oral) { const ant = df.avaliacoes[u.id]?.valores[c.id]; if (ant) valores[c.id] = ant; continue; }
    const conceito = val('cc_' + c.id), raw = val('nt_' + c.id), obs = val('ob_' + c.id); const n = lerNota(raw); const f = faixaDe(conceito);
    if (!conceito && raw === '') { if (enviar && !primeiroErro) primeiroErro = ['cc_' + c.id, `Avalie o critério "${c.nome}".`]; continue; }
    if (!f) { primeiroErro = primeiroErro || ['cc_' + c.id, 'Escolha o conceito.']; continue; }
    if (raw === '' || isNaN(n)) { primeiroErro = primeiroErro || ['nt_' + c.id, 'Nota com uma casa decimal (ex.: 8,5).']; continue; }
    if (n < f[1] || n > f[2]) { primeiroErro = primeiroErro || ['nt_' + c.id, `Para ${conceito}, a nota vai de ${fmtNota(f[1])} a ${fmtNota(f[2])}.`]; continue; }
    valores[c.id] = { conceito, nota: r1(n), obs };
  }
  if (primeiroErro) return erroCampo(primeiroErro[0], primeiroErro[1]);
  let assinatura = df.avaliacoes[u.id]?.assinatura || null;
  if (enviar) {
    const usarPerfil = $('as_perfil') && $('as_perfil').checked;
    assinatura = window._assNova || (usarPerfil ? membro(u.id).assinatura : null);
    if (!assinatura) { toast('Anexe a imagem da sua assinatura ou reutilize a do perfil para enviar.', 'erro'); return false; }
    if (window._assNova && val('as_salvar')) membro(u.id).assinatura = window._assNova;
  }
  df.avaliacoes[u.id] = { valores, enviado: !!enviar, assinatura, ts: now().getTime() };
  calcularResultado(df);                                         // RBN-DEF-06.1: recalcula a cada envio ou reenvio
  auditar(enviar ? 'Enviou avaliação assinada' : 'Salvou avaliação', aluno(tcc(df.tccId).matricula).nome); salvar(); render();
  toast(enviar ? 'Avaliação enviada.' : 'Avaliação salva.', 'ok');
}

// RBN-DEF-06.4: Liberar Resultado — bloqueia notas, gera os documentos, atualiza o Status do TCC e muda a sessão para Realizada

    df.liberadoEm = now().getTime(); df.status = 'Realizada';
    registrarDefesa(df, 'Liberação do resultado · Status: Realizada', `Nota final ${fmtNota(df.resultado.final)} · ${df.resultado.parecer}`);
    mudarSituacao(x, df.resultado.parecer, 'Liberação do resultado da banca');
    // RBN-DEF-08.4: declaração individual por e-mail a cada membro efetivo, com código de validação único
    df.declaracoes = membrosEfetivos(df).map(m => ({ membro: m, codigo: 'DEC-' + token() }));
    df.declaracoes.forEach(dc => enviarEmail(emailDe(dc.membro), 'SIGTCC — Declaração de participação em banca', `Declaração de participação na banca de "${x.titulo}". Código de validação: ${dc.codigo}.`, { tipo: 'declaracao', token: df.id + '|' + dc.membro }));
    auditar('Liberou resultado da defesa', `${aluno(x.matricula).nome}: ${df.resultado.parecer} (${fmtNota(df.resultado.final)})`); salvar(); render(); setTimeout(() => abrirDefesa(id));
  });
}
// RBN-DEF-02.6 a 02.8: acionamento do suplente (sessão Em Andamento)

      df.banca.acionamento = { substituido: sub, justificativa: j, ts: now().getTime(), por: me().nome }; delete df.avaliacoes[sub];

    h += `<div class="sec-tit c-azul">Versão Final ${chipVF(st)}</div>`;
    if (!a) h += '<p class="muted">A entrega do tipo Versão Final ainda não foi cadastrada pelo Professor da Disciplina.</p>';
    if (vf?.link) h += `<p>Primeiro envio em ${fmtDH(vf.ts)}: <a href="${esc(vf.link)}" target="_blank" rel="noopener">abrir</a></p>`;
    if (vf?.msg) h += `<div class="alerta aviso"><span class="ms">feedback</span><div>Mensagem do Professor da Disciplina: ${esc(vf.msg)}</div></div>`;
    if (podeEnviarVF(x, df)) h += `${passouPrazo(a) && !subst ? '<div class="alerta aviso"><span class="ms">warning</span>Data Limite vencida: o envio será registrado como Entregue com Atraso.</div>' : ''}
      <div class="linha2" style="align-items:end">${campo('vf_link', 'Link da Versão Final *', { valor: subst ? vf.link : '', max: 500, ph: 'https://drive.google.com/…', dica: 'PDF único e público com o texto final corrigido, a Folha de Aprovação assinada e a ficha catalográfica.' })}<div class="campo"><button class="btn pri" onclick="enviarVersaoFinal('${x.id}')"><span class="ms">send</span>${subst ? 'Substituir link' : 'Enviar'}</button></div></div>`;

}

// Na página publicada, arquivos são entregues pela capacidade "downloads" (o visualizador confirma o salvamento)
let DOWNLOADS = null;
if (PUBLICADO && window.claude && window.claude.use) window.claude.use('downloads').then(d => { DOWNLOADS = d; }).catch(() => {});
function previaArquivo(nome, textoAlternativo, htmlPrevia) {
  abrirModal({ titulo: nome, icone: 'description', tam: 'lg', corpo: `<div class="alerta info"><span class="ms">info</span><div>Não foi possível salvar o arquivo nesta visualização. Conteúdo de <b>${esc(nome)}</b>:</div></div>${htmlPrevia || `<textarea class="inp" readonly style="min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(textoAlternativo || '')}</textarea>`}` });
}
function entregarArquivo(nome, blob, textoAlternativo, htmlPrevia) {
  if (!blob) return previaArquivo(nome, textoAlternativo, htmlPrevia);        // sem jsPDF/SheetJS (offline)
  if (PUBLICADO) {
    if (!DOWNLOADS) return previaArquivo(nome, textoAlternativo, htmlPrevia);
    DOWNLOADS.save({ filename: nome, data: blob }).then(() => toast('Arquivo salvo: ' + nome, 'ok')).catch(e => {
      const c = e && e.code; if (c === 'declined') return;
      if (c === 'rate_limited') return toast('Já há uma confirmação de download aberta.', 'erro');
      previaArquivo(nome, textoAlternativo, htmlPrevia);
    });
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.appendChild(a); a.click(); a.remove(); toast('Arquivo gerado: ' + nome, 'ok');
}
